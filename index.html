  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
  /* ===== Design system SIM-Pramuka (Stitch): Coklat Pembina #5D4037 · Tanda Kehormatan #D97706 · Tunas Rimba #2E5A36 · kertas #FFF8F5 ===== */
  :root { --primer: #5d4037; --primer-gelap: #442a22; --amber: #d97706; --hijau: #2e5a36; --garis: rgba(93,64,55,.10); --kertas: #fcf2eb; --sb: 272px; }
  html, body { min-height: 100vh; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #fff8f5; color: #1f1b17; }
  h1, h2, h3, .font-display { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: -0.01em; }
  h1.font-display { letter-spacing: -0.02em; font-weight: 800; }
  .tali { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 6px, transparent 6px 14px); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

  /* kartu & panel */
  .card { background: #fff; border: 1px solid var(--garis); border-radius: .5rem; box-shadow: 0 1px 2px rgba(93,64,55,.04); }
  .panel-kertas { background: linear-gradient(180deg, #fcf2eb 0%, #fff8f5 100%); border: 1px solid var(--garis); border-radius: .75rem; }
  .hero-gelap { background: radial-gradient(120% 140% at 100% 0%, #6d4c41 0%, #442a22 55%, #2c160e 100%); color: #fff; border-radius: .75rem; }
  .kpi-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #504441; }
  .kpi-ikon { width: 2.5rem; height: 2.5rem; border-radius: .375rem; display: grid; place-items: center; }
  .kpi-ikon svg { width: 1.25rem; height: 1.25rem; }

  /* tombol */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: .375rem; padding: .55rem 1rem; min-height: 2.5rem; font-weight: 600; font-size: .875rem; transition: background .15s, box-shadow .15s, color .15s; white-space: nowrap; border: 1px solid transparent; }
  .btn svg { width: 1rem; height: 1rem; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--primer); outline-offset: 2px; }
  .btn-primary { background: var(--primer); color: #fff; } .btn-primary:hover:not(:disabled) { background: #4e342e; }
  .btn-tunas { background: var(--amber); color: #fff; } .btn-tunas:hover:not(:disabled) { background: #b45309; }
  .btn-ghost { background: #fff; color: var(--primer); border-color: rgba(93,64,55,.22); } .btn-ghost:hover:not(:disabled) { background: #fcf2eb; }
  .btn-daun { background: var(--hijau); color: #fff; } .btn-daun:hover:not(:disabled) { background: #24502d; }
  .btn-merah { background: #ffdad6; color: #93000a; } .btn-merah:hover:not(:disabled) { background: #ffc7c0; }
  .btn-wa { background: #25d366; color: #fff; } .btn-wa:hover:not(:disabled) { background: #1ebe5a; }
  .btn-sm { padding: .3rem .65rem; min-height: 2rem; font-size: .78rem; }

  /* form */
  .inp { width: 100%; border: 1px solid #d7ccc8; background: #fff; border-radius: .375rem; padding: .5rem .75rem; font-size: .9rem; outline: none; color: #1f1b17; }
  .inp:focus { border-color: var(--primer); box-shadow: 0 0 0 2px rgba(93,64,55,.25); }
  .lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: #504441; margin-bottom: .3rem; }
  input[type=checkbox], input[type=radio] { accent-color: var(--hijau); }

  /* chip / lencana */
  .chip { display: inline-flex; align-items: center; gap: .25rem; padding: .14rem .55rem; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .chip-abu { background: #f6ece6; color: #5d4037; } .chip-hijau { background: #e8f5e9; color: #24502d; } .chip-kuning { background: #fef3c7; color: #92400e; }
  .chip-merah { background: #ffdad6; color: #93000a; } .chip-biru { background: #f1f5f9; color: #475569; } .chip-ungu { background: #ede9fe; color: #5b21b6; }
  .chip-coklat { background: #5d4037; color: #fff; } .chip-amber { background: #d97706; color: #fff; }

  /* tabel */
  .tbl { width: 100%; font-size: .84rem; border-collapse: separate; border-spacing: 0; }
  .tbl th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #504441; background: #f5f0e8; padding: .65rem .75rem; border-bottom: 1px solid #efebe6; position: sticky; top: 0; z-index: 1; }
  .tbl td { padding: .65rem .75rem; border-bottom: 1px solid #efebe6; vertical-align: top; font-variant-numeric: tabular-nums; }
  .tbl tr:hover td { background: #faf7f2; }

  /* sidebar (desktop: penuh / ringkas / tersembunyi · ponsel: laci) */
  #sidebar { width: var(--sb); background: var(--kertas); border-right: 1px solid var(--garis); transition: width .2s ease, transform .2s ease; }
  .nav-grup { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #a8928a; padding: .9rem .9rem .3rem; }
  .nav-a { display: flex; align-items: center; gap: .75rem; padding: .55rem .8rem; border-radius: .375rem; color: #504441; font-weight: 500; font-size: .875rem; white-space: nowrap; }
  .nav-a:hover { background: #f0e6e0; color: #1f1b17; }
  .nav-a.aktif { background: var(--primer); color: #fff; font-weight: 600; box-shadow: 0 4px 12px -4px rgba(93,64,55,.45); }
  .nav-a svg { width: 1.2rem; height: 1.2rem; flex: none; }
  .nav-a .nav-badge { margin-left: auto; }
  @media (min-width: 1024px) {
    body.sb-mini #sidebar { width: 76px; }
    body.sb-mini #sidebar .sb-teks, body.sb-mini #sidebar .nav-grup, body.sb-mini #sidebar .nav-badge { display: none; }
    body.sb-mini #sidebar .nav-a { justify-content: center; padding: .65rem; }
    body.sb-tutup #sidebar { width: 0; border: 0; overflow: hidden; }
  }
  @media (max-width: 1023px) { #sidebar { width: min(86vw, 300px); } }

  /* tab & lain-lain */
  .tab { padding: .5rem .9rem; border-radius: .375rem; font-weight: 600; font-size: .85rem; color: #5d4037; }
  .tab.aktif { background: var(--primer); color: #fff; }
  .spinner { width: 1.1rem; height: 1.1rem; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in { animation: fade .2s ease-out; } @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .ring-prog { --p: 0; background: conic-gradient(#2e5a36 calc(var(--p) * 1%), #f6ece6 0); }
  .bar { height: .45rem; border-radius: 999px; background: #f0e6e0; overflow: hidden; } .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--hijau); }
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  details > summary { cursor: pointer; list-style: none; } details > summary::-webkit-details-marker { display: none; }

  /* toast sukses (pengesahan SKU) */
  #toast-kanan { position: fixed; top: 1.25rem; right: 1.25rem; z-index: 70; display: flex; flex-direction: column; gap: .6rem; width: min(92vw, 400px); }
  .toast-sukses { background: #0a3918; color: #fff; border-radius: .6rem; box-shadow: 0 16px 36px -8px rgba(10,57,24,.45); overflow: hidden; animation: masuk .35s cubic-bezier(.2,.8,.2,1); }
  .toast-sukses .bar-waktu { height: 3px; background: #fbbf24; transform-origin: left; animation: habis var(--dur, 6s) linear forwards; }
  @keyframes masuk { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes habis { to { transform: scaleX(0); } }

  /* piagam & poster */
  .piagam-wrap { position: relative; width: 100%; overflow: hidden; background: #f0e6e0; border-radius: .5rem; }
  .piagam { position: absolute; left: 0; top: 0; width: 595px; height: 842px; transform-origin: 0 0; font-family: 'Times New Roman', serif; color: #1a1a1a; background: #fff; }
  .piagam .tb { position: absolute; text-align: center; line-height: 1.2; }

  @media print { aside, header, .no-print, #toast, #toast-kanan { display: none !important; } main { margin: 0 !important; } }

  /* ---------- Tema halaman depan (login) ---------- */
  .hero-tema { position: relative; overflow: hidden; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); isolation: isolate; }
  .hero-tema.tanpa-foto::after { content: ''; position: absolute; inset: 0; z-index: 1; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 6px, transparent 6px 14px); }
  .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease, transform 1.4s ease; z-index: 0; }
  .hero-slide.aktif { opacity: 1; }
  .hero-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .efek-zoom .hero-slide.aktif img { animation: kenburns var(--dur, 8s) ease-out forwards; }
  .efek-geser .hero-slide { transform: translateX(6%); }
  .efek-geser .hero-slide.aktif { transform: none; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
  .hero-overlay { position: absolute; inset: 0; z-index: 1; background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 100%); opacity: var(--gelap, .55); }
  .hero-overlay::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.55) 0%, transparent 45%), linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 30%); }
  .hero-isi { position: relative; z-index: 2; }
  .hero-aksen { color: var(--aksen); }
  .hero-ket { transition: opacity .6s ease; }
  .hero-titik { display: flex; gap: 6px; }
  .hero-titik button { width: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.45); transition: all .3s; }
  .hero-titik button.aktif { width: 22px; background: var(--aksen); }
  .tema-swatch { width: 100%; aspect-ratio: 16/10; border-radius: 12px; border: 2px solid transparent; background: linear-gradient(135deg, var(--g1), var(--g2)); position: relative; }
  .tema-swatch.aktif { border-color: var(--aksen); box-shadow: 0 0 0 3px rgba(217,119,6,.35); }
  @media (prefers-reduced-motion: reduce) { .hero-slide, .hero-slide img, .hero-ket { transition: none !important; animation: none !important; } }
</style>
</head>

  <script>
/* ===================================================================
 * SIM-Pramuka — inti frontend: API, sesi, layout, router, komponen.
 * =================================================================== */
const KEY = 'simpramuka.sesi.v1';
const S = { token: null, user: null, route: 'dashboard', params: {} };
const ACT = {};      // handler tombol: data-act="nama"
const VIEWS = {};    // halaman

/* ---------- util ---------- */
const e = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = (n) => (Number(n) < 0 ? '-Rp' : 'Rp') + Math.abs(Math.round(Number(n) || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
function tgl(s, panjang) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return e(s || '-');
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return (panjang ? HARI[d.getDay()] + ', ' : '') + d.getDate() + ' ' + (panjang ? BULAN : BLN)[d.getMonth()] + ' ' + d.getFullYear();
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const can = (p) => !!S.user && (S.user.perms.includes('*') || S.user.perms.includes(p));
const canAny = (...ps) => ps.some(can);
const isAdmin = () => S.user && S.user.role === 'admin';
const inisial = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const avatar = (u, size = 'w-10 h-10') => u && u.foto_url
  ? `<img src="${e(u.foto_url)}" class="${size} rounded-full object-cover border-2 border-coklat-200" alt="">`
  : `<div class="${size} rounded-full bg-coklat-200 text-coklat-700 grid place-items-center font-bold text-sm">${e(inisial(u && (u.nama_lengkap || u.nama)))}</div>`;

/* ---------- Koneksi server ----------
 * Satu Index.html untuk dua cara pakai:
 *  • dibuka dari Web App Apps Script (/exec)   → memakai google.script.run (otomatis, tanpa pengaturan)
 *  • di-hosting (Netlify, GitHub Pages, cPanel) → memakai fetch ke URL /exec yang ditulis di SIM_API_URL (bagian <head> file ini)
 */
const MODE_GAS = !!(window.google && google.script && google.script.run);
function SIM_API() { const u = String(window.SIM_API_URL || '').trim(); return /^https:\/\/.+\/exec$/.test(u) ? u : ''; }
function kirimApi(req, ok, fail) {
  if (MODE_GAS) return google.script.run.withSuccessHandler(ok).withFailureHandler(fail).api(req);
  const url = SIM_API();
  if (!url) return fail(new Error('Server belum dihubungkan: isi SIM_API_URL di index.html dengan URL Web App /exec.'));
  fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(t => { if (/^\s*</.test(t)) throw new Error('Alamat server bukan Web App /exec yang aktif (atau akses deployment belum "Anyone").'); ok(t); })
    .catch(fail);
}

/* ---------- API ---------- */
/* Cache baca di browser (20 detik): pindah-pindah menu terasa instan. Setiap aksi tulis mengosongkan cache. */
const CACHE_BACA = new Map();
const AKSI_BACA = /(^dashboard$|^tugas$|\.(list|detail|me|rekap\w*|progress|statistik|jenis|templates|gambar|bingkai|sangga|riwayat|saya|lihat|get|akun|sesi|galat|kesehatan|peringatan)$|^garuda\.status$)/i;
const AKSI_TANPA_CACHE = /^(auth\.|sistem\.|admin\.kesehatan|admin\.sesi|admin\.galat|admin\.peringatan|notif\.list|tugas$)/;
/** Panggil server. Otomatis mencoba ulang (maks. 3×, jeda bertahap) bila server sedang ramai / koneksi putus / baru memperbaiki diri. */
function call(action, payload, _coba = 0) {
  const baca = AKSI_BACA.test(action) && !AKSI_TANPA_CACHE.test(action);
  const kunci = baca ? action + '|' + JSON.stringify(payload || {}) : '';
  if (baca && _coba === 0) {
    const c = CACHE_BACA.get(kunci);
    if (c && Date.now() - c.t < 20000) return Promise.resolve(JSON.parse(c.d));
  }
  if (!baca && _coba === 0) CACHE_BACA.clear();
  return new Promise((resolve, reject) => {
    const ulang = (err, jeda) => {
      if (_coba < 3) setTimeout(() => call(action, payload, _coba + 1).then(resolve, reject), jeda || (800 * Math.pow(2, _coba) + Math.random() * 400));
      else reject(err);
    };
    kirimApi({ action, token: S.token, payload: payload || {} }, raw => {
      let r;
      try { r = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (_) { return reject(new Error('Balasan server tidak dikenali.')); }
      if (r.ok) {
        if (baca) { try { CACHE_BACA.set(kunci, { t: Date.now(), d: JSON.stringify(r.data) }); if (CACHE_BACA.size > 80) CACHE_BACA.delete(CACHE_BACA.keys().next().value); } catch (_) { } }
        return resolve(r.data);
      }
      const err = new Error(r.error); err.dariServer = true;
      if (r.code === 'SESI_HABIS') { keluar(true); }
      if (r.code === 'DIPERBAIKI') { toast(r.error, 'ok'); CACHE_BACA.clear(); return ulang(err, 1200); }
      if (/sedang sibuk/i.test(r.error || '')) return ulang(err);
      reject(err);
    }, err => {
      const m = err && err.message ? err.message : '';
      if (/belum dihubungkan|bukan Web App/.test(m)) return reject(err);
      if (/too many|terlalu banyak|timed? ?out|NetworkError|Failed to fetch|Load failed|quota|HTTP 5/i.test(m) || !m) return ulang(new Error('Koneksi ke server gagal' + (m ? ': ' + m : '.')));
      reject(new Error('Koneksi ke server gagal: ' + m));
    });
  });
}

/* ---------- Pelaporan galat otomatis ke Admin (Kesehatan Sistem) ---------- */
let _jmlLapor = 0;
function laporGalat(pesan, detail) {
  if (_jmlLapor >= 5 || !pesan || /Script error\.?$|ResizeObserver|extension:\/\//i.test(String(pesan) + String(detail || ''))) return;
  _jmlLapor++;
  try { kirimApi({ action: 'sistem.lapor', token: S.token, payload: { pesan: String(pesan).slice(0, 300), detail: String(detail || '').slice(0, 1400), halaman: S.route || 'login', ua: navigator.userAgent } }, () => { }, () => { }); } catch (_) { }
}
window.addEventListener('error', ev => laporGalat(ev.message, (ev.error && ev.error.stack) || (ev.filename + ':' + ev.lineno)));
window.addEventListener('unhandledrejection', ev => { const r = ev.reason || {}; if (!r.dariServer && !/Koneksi ke server/.test(r.message || '')) laporGalat('Promise: ' + (r.message || r), r.stack); });

/** Jalankan aksi dengan indikator loading pada tombol + toast error. */
async function aksi(btn, fn, okMsg) {
  const html = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try { const r = await fn(); if (okMsg) toast(okMsg, 'ok'); return r; }
  catch (err) { toast(err.message, 'err'); throw err; }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = html; } }
}

/* ---------- toast & modal ---------- */
function toast(msg, type) {
  const el = document.createElement('div');
  const c = type === 'err' ? 'bg-red-800' : type === 'ok' ? 'bg-daun-600' : 'bg-coklat-800';
  el.className = `${c} text-white px-4 py-3 rounded-lg shadow-ambient text-sm fade-in`;
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 6500 : 3500);
}
/**
 * Toast sukses berdetail (pojok kanan atas, garis waktu, tombol tutup & aksi).
 * o = { judul, isi, meta, aksi: [{label, href|act, kelas}], durasi }
 */
function toastSukses(o) {
  let box = document.getElementById('toast-kanan');
  if (!box) { box = document.createElement('div'); box.id = 'toast-kanan'; document.body.appendChild(box); }
  const el = document.createElement('div');
  const dur = o.durasi || 7000;
  el.className = 'toast-sukses';
  el.style.setProperty('--dur', dur + 'ms');
  el.innerHTML = `<div class="p-4 flex gap-3"><div class="w-9 h-9 rounded-full bg-tunas-400 text-coklat-900 grid place-items-center flex-none"><span class="w-5 h-5">${IC.cek}</span></div>
    <div class="min-w-0 flex-1"><div class="font-bold leading-snug">${e(o.judul)}</div>${o.isi ? `<div class="text-sm text-green-100 mt-1">${o.isi}</div>` : ''}
    ${o.meta ? `<div class="text-[11px] text-green-200/80 mt-2">${o.meta}</div>` : ''}
    ${(o.aksi || []).length ? `<div class="flex flex-wrap gap-2 mt-3">${o.aksi.map(a => a.href ? `<a class="btn btn-sm ${a.kelas || 'btn-wa'}" target="_blank" rel="noopener" href="${e(a.href)}">${a.label}</a>` : `<button class="btn btn-sm ${a.kelas || 'btn-ghost'}" data-act="${a.act}">${a.label}</button>`).join('')}</div>` : ''}</div>
    <button class="text-green-200 hover:text-white text-xl leading-none self-start" aria-label="Tutup">&times;</button></div><div class="bar-waktu"></div>`;
  el.querySelector('button[aria-label=Tutup]').onclick = () => el.remove();
  box.appendChild(el);
  let t = setTimeout(() => el.remove(), dur);
  el.onmouseenter = () => { clearTimeout(t); el.querySelector('.bar-waktu').style.animationPlayState = 'paused'; };
  el.onmouseleave = () => { el.querySelector('.bar-waktu').style.animationPlayState = 'running'; t = setTimeout(() => el.remove(), 2500); };
}
/** Toast standar setelah butir SKU/SKK disahkan + status notifikasi WhatsApp. */
function toastPengesahan(r) {
  const n = r.notif || {};
  const wa = n.status === 'TERKIRIM' ? '✓ Notifikasi WhatsApp terkirim ke anggota' : n.status === 'MANUAL' ? 'WhatsApp siap dikirim (gateway belum dipasang)' : n.status === 'TANPA_NOMOR' ? 'Nomor HP anggota belum diisi — WA tidak dikirim' : n.status === 'GAGAL' ? 'WA gagal terkirim, coba kirim manual' : '';
  toastSukses({ judul: (r.butir && /TKK/.test(r.butir) ? 'SKK' : 'Butir SKU') + ' berhasil disahkan & tersinkron!',
    isi: `<b>${e(r.butir || '')}</b>${r.nama ? ' atas nama <b>' + e(r.nama) + '</b>' : ''}${r.progres ? ` · progres ${r.progres.lulus}/${r.progres.total}` : ''}${r.sertifikat ? `<br>🎖️ Seluruh butir tuntas — piagam <b>${e(r.sertifikat.nomor)}</b> terbit otomatis.` : ''}`,

/**
 * modal(judul, isiHtml, {submit:'Simpan', onSubmit: async (data, form, btn) => {...}, lebar:true})
 * onSubmit mengembalikan false untuk menahan modal tetap terbuka.
 */
function modal(judul, isi, o = {}) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="fixed inset-0 z-50 bg-coklat-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" data-close-bg>
    <form class="bg-white w-full ${o.lebar ? 'sm:max-w-3xl' : 'sm:max-w-lg'} max-h-[92vh] flex flex-col rounded-t-2xl sm:rounded-2xl shadow-2xl fade-in" novalidate>
      <div class="flex items-center justify-between px-5 py-4 border-b border-coklat-100">
        <h3 class="font-display text-lg font-bold text-coklat-800">${e(judul)}</h3>
        <button type="button" class="text-coklat-400 hover:text-coklat-700 text-2xl leading-none" data-close>&times;</button>
      </div>
      <div class="px-5 py-4 overflow-y-auto space-y-3">${isi}</div>
      <div class="px-5 py-3 border-t border-coklat-100 flex justify-end gap-2 ${o.onSubmit || o.footer ? '' : 'hidden'}">
        ${o.footer || ''}<button type="button" class="btn btn-ghost" data-close>Batal</button>
        ${o.onSubmit ? `<button type="submit" class="btn btn-primary">${e(o.submit || 'Simpan')}</button>` : ''}
      </div>
    </form></div>`;
  const form = root.querySelector('form');
  const close = () => { root.innerHTML = ''; };
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  root.querySelector('[data-close-bg]').addEventListener('mousedown', ev => { if (ev.target.hasAttribute('data-close-bg')) close(); });
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    if (!o.onSubmit) return;
    const btn = form.querySelector('button[type=submit]');
    try { const r = await aksi(btn, () => o.onSubmit(formData(form), form, btn)); if (r !== false) close(); } catch (_) { }
  };
  if (o.onOpen) o.onOpen(form, close);
  const first = form.querySelector('input:not([type=hidden]),select,textarea');
  if (first && window.innerWidth > 640) first.focus();
  return { form, close };
}

function konfirmasi(pesan, okText = 'Ya, lanjutkan') {
  return new Promise(res => {
    const m = modal('Konfirmasi', `<p class="text-sm">${e(pesan)}</p>`, { submit: okText, onSubmit: () => { res(true); } });
    m.form.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => res(false)));
  });
}

function formData(form) {
  const o = {};
  new FormData(form).forEach((v, k) => {
    if (k.endsWith('[]')) { const kk = k.slice(0, -2); (o[kk] = o[kk] || []).push(v); }
    else o[k] = typeof v === 'string' ? v.trim() : v;
  });
  form.querySelectorAll('input[type=checkbox][data-bool]').forEach(c => { o[c.name] = c.checked ? 'YA' : 'TIDAK'; });
  return o;
}

/* ---------- berkas ---------- */
function bacaFile(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Gagal membaca file')); r.readAsDataURL(file); });
}
/** Kompres foto (maks 1600px, JPEG 80%) agar unggah cepat & hemat kuota Drive. */
async function kompresFoto(file, max = 1600, q = 0.8) {
  if (!file) return '';
  if (!/^image\//.test(file.type)) throw new Error('File harus berupa gambar.');
  const url = await bacaFile(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak valid')); i.src = url; });
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function berkasDokumen(file) {
  if (!file) return '';
  if (file.size > 8 * 1024 * 1024) throw new Error('Ukuran file maksimal 8 MB.');
  if (/^image\//.test(file.type)) return kompresFoto(file);
  if (file.type !== 'application/pdf') throw new Error('Hanya gambar atau PDF.');
  return bacaFile(file);
}
function unduhBase64(nama, b64, mime = 'application/pdf') {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([arr], { type: mime }));
  a.download = namaAman(nama); a.click();
}
/** Panggil aksi unduhan server → simpan file (base64) atau buka tautan (file besar). */
async function unduhDari(btn, action, payload) {
  const r = await aksi(btn, () => call(action, payload)).catch(() => null);
  if (!r) return null;
  if (r.base64) unduhBase64(r.nama, r.base64, r.mime);
  else if (r.url) window.open(r.url, '_blank');
  toast('Mengunduh ' + r.nama, 'ok');
  return r;
}
/** Tombol unduh berformat: data-act="unduh" data-a="aksi" data-p='{"id":..}' */
function tombolUnduh(action, payload, formats = ['pdf', 'docx'], kecil = true) {
  const lbl = { pdf: 'PDF', docx: 'Word', xlsx: 'Excel', pptx: 'PPTX' };
  return `<span class="inline-flex gap-1">${formats.map(f => `<button type="button" class="btn ${f === 'pdf' ? 'btn-primary' : 'btn-ghost'} ${kecil ? 'btn-sm' : ''}" data-act="unduh" data-a="${action}" data-f="${f}" data-p="${e(JSON.stringify(payload || {}))}">⬇ ${lbl[f]}</button>`).join('')}</span>`;
}
ACT.unduh = (el) => { const p = JSON.parse(el.dataset.p || '{}'); p.format = el.dataset.f; unduhDari(el, el.dataset.a, p); };
/** Ekspor tabel yang sedang tampil: daftarkan data lalu tampilkan tombol PDF/Word/Excel. */
const EKS = {};
function tombolEkspor(id, judul, kolom, baris, opt = {}) {
  EKS[id] = { judul, kolom, baris, subjudul: opt.sub || '', gudep: opt.gudep || '', ttd: !!opt.ttd, catatan: opt.catatan || '' };
  return `<span class="inline-flex gap-1">${['pdf', 'docx', 'xlsx'].map(f => `<button type="button" class="btn btn-ghost btn-sm" data-act="eksTabel" data-id="${id}" data-f="${f}">⬇ ${({ pdf: 'PDF', docx: 'Word', xlsx: 'Excel' })[f]}</button>`).join('')}</span>`;
}
ACT.eksTabel = (el) => { const t = EKS[el.dataset.id]; if (!t) return; unduhDari(el, 'export.tabel', Object.assign({ format: el.dataset.f }, t)); };
/** Nama file aman untuk semua peramban/OS (tanpa karakter khusus). */
function namaAman(n) { return String(n).replace(/[\u2013\u2014\u00b7\u2022]/g, '-').replace(/[^\x20-\x7E]/g, '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim(); }
function unduhCsv(nama, rows) {
  const csv = rows.map(r => r.map(c => '"' + String(c === null || c === undefined ? '' : c).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = namaAman(nama); a.click();
}

function go(route, params) {
  const q = params ? '?' + new URLSearchParams(params).toString() : '';
  if (location.hash !== '#/' + route + q) location.hash = '#/' + route + q; else render();
}
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [r, q] = h.split('?');
  S.route = r || 'dashboard';
  S.params = Object.fromEntries(new URLSearchParams(q || ''));
}
window.addEventListener('hashchange', () => { parseHash(); render(); });

  let grup = '';
  const items = [];
  MENU.forEach(m => {
    if (m.grup) { grup = m.grup; return; }
    if (!m.show()) return;
    if (grup) { items.push(`<div class="nav-grup">${grup}</div>`); grup = ''; }
    items.push(`<a href="#/${m.id}" title="${e(m.label)}" class="nav-a ${S.route === m.id ? 'aktif' : ''}">${IC[m.icon]}<span class="sb-teks">${m.label}</span>${m.id === 'dashboard' && S.nTugas ? `<span class="chip chip-amber nav-badge">${S.nTugas}</span>` : ''}</a>`);
  });
  return `

        <div class="leading-tight min-w-0 sb-teks"><div class="font-extrabold text-coklat-800 tracking-tight">SIM-PRAMUKA</div>

      </div>

          <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-coklat-400">${IC.cari}</span>
          <input id="cariGlobal" class="inp !pl-9 !bg-coklat-50" placeholder="Cari menu: proposal, logbook, buletin…" autocomplete="off">
          <div id="hasilCari" class="hidden absolute left-0 right-0 top-full mt-1 card shadow-ambient p-1 z-30"></div>
        </div>

/* status sidebar desktop: penuh → ringkas → tersembunyi (tersimpan di perangkat) */
const SB_KEY = 'simpramuka.sidebar';
function terapkanSidebar() {
  let m = 'penuh'; try { m = localStorage.getItem(SB_KEY) || 'penuh'; } catch (_) { }
  document.body.classList.toggle('sb-mini', m === 'ringkas');
  document.body.classList.toggle('sb-tutup', m === 'tutup');
}
ACT.toggleSidebar = () => {
  if (window.innerWidth < 1024) { const sb = document.getElementById('sidebar'); return sb.classList.contains('-translate-x-full') ? bukaMenu() : tutupMenu(); }
  let m = 'penuh'; try { m = localStorage.getItem(SB_KEY) || 'penuh'; } catch (_) { }
  const next = { penuh: 'ringkas', ringkas: 'tutup', tutup: 'penuh' }[m];
  try { localStorage.setItem(SB_KEY, next); } catch (_) { }
  terapkanSidebar();
  toast({ penuh: 'Menu ditampilkan penuh', ringkas: 'Menu ringkas (ikon saja)', tutup: 'Menu disembunyikan — klik ikon panel untuk menampilkan' }[next]);
};
async function muatTugas(paksa) {
  if (!S.token) return;
  if (!paksa && S.tugasAt && Date.now() - S.tugasAt < 90e3) return;
  S.tugasAt = Date.now();
  try { S.tugas = await call('tugas'); S.nTugas = Object.values(S.tugas || {}).reduce((a, b) => a + (Number(b) || 0), 0); } catch (_) { return; }
  const b = document.querySelector('[data-act=bukaNotif]');
  if (b) { const old = b.querySelector('span.absolute'); if (old) old.remove(); if (S.nTugas) b.insertAdjacentHTML('beforeend', `<span class="absolute -top-1 -right-1 bg-tunas-500 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] grid place-items-center px-1">${S.nTugas}</span>`); }
}
ACT.bukaNotif = () => {
  const p = document.getElementById('panelNotif');
  const list = Object.entries(S.tugas || {}).filter(([, n]) => n > 0);
  p.innerHTML = `<div class="px-2 py-1 eyebrow text-coklat-500">Tugas & notifikasi</div>` + (list.length ? list.map(([k, n]) => `<a href="#/${TUGAS_LABEL[k] ? TUGAS_LABEL[k][1] : 'dashboard'}" class="flex items-center justify-between gap-2 px-2 py-2 rounded hover:bg-coklat-50 text-sm"><span>${e(TUGAS_LABEL[k] ? TUGAS_LABEL[k][0] : k)}</span><span class="chip chip-amber">${n}</span></a>`).join('')
    : '<p class="px-2 py-3 text-sm text-coklat-500">Tidak ada tugas tertunda.</p>');

};
document.addEventListener('click', (ev) => {
  const p = document.getElementById('panelNotif');
  if (p && !p.classList.contains('hidden') && !ev.target.closest('#panelNotif') && !ev.target.closest('[data-act=bukaNotif]')) p.classList.add('hidden');
  const h = document.getElementById('hasilCari');
  if (h && !ev.target.closest('#hasilCari') && ev.target.id !== 'cariGlobal') h.classList.add('hidden');
});
document.addEventListener('input', (ev) => {
  if (ev.target.id !== 'cariGlobal') return;
  const q = ev.target.value.toLowerCase().trim(), h = document.getElementById('hasilCari');
  const hit = q ? MENU.filter(m => m.id && m.show() && (m.label + ' ' + m.id).toLowerCase().includes(q)).slice(0, 7) : [];
  h.innerHTML = hit.map(m => `<a href="#/${m.id}" class="flex items-center gap-2 px-2 py-2 rounded hover:bg-coklat-50 text-sm"><span class="w-4 h-4 text-coklat-500">${IC[m.icon]}</span>${m.label}</a>`).join('') || (q ? '<p class="px-2 py-2 text-sm text-coklat-500">Tidak ditemukan.</p>' : '');

});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'cariGlobal') { const a = document.querySelector('#hasilCari a'); if (a) { location.hash = a.getAttribute('href'); } } });

function judulHalaman(judul, sub, aksiHtml = '', eyebrow = '') {

const memuat = () => `<div class="flex items-center gap-3 text-coklat-500 py-16 justify-center"><span class="spinner"></span> Memuat…</div>`;
function tabs(list, aktif, act = 'tab') {

function chipStatus(s) {
  const m = { AKTIF: 'hijau', LULUS: 'hijau', DISETUJUI: 'hijau', SELESAI: 'hijau', HADIR: 'hijau', MENUNGGU: 'kuning', DIAJUKAN: 'kuning', DIVERIFIKASI: 'biru',
    BERLANGSUNG: 'biru', DIJADWALKAN: 'abu', PROSES: 'abu', DITOLAK: 'merah', DIBATALKAN: 'merah', ALPA: 'merah', IZIN: 'ungu', SAKIT: 'ungu', NONAKTIF: 'merah', DIRENCANAKAN: 'abu', DRAFT: 'abu', REVISI: 'merah', TERVERIFIKASI: 'hijau', BELUM: 'abu' };
  return `<span class="chip chip-${m[s] || 'abu'}">${e(s)}</span>`;
}
function opsi(list, sel) { return list.map(x => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${e(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${e(l)}</option>`; }).join(''); }
function fld(label, input, help) { return `<div><label class="lbl">${label}</label>${input}${help ? `<p class="text-[11px] text-coklat-400 mt-1">${help}</p>` : ''}</div>`; }
const inp = (name, val = '', attrs = '') => `<input class="inp" name="${name}" value="${e(val)}" ${attrs}>`;

/* ---------- render ---------- */
let renderSeq = 0;
async function render() {
  if (!S.token) return renderLogin();
  if (!document.getElementById('page')) document.getElementById('app').innerHTML = shell();
  else document.getElementById('app').innerHTML = shell();
  terapkanSidebar();
  tutupMenu();
  muatTugas();
  const view = VIEWS[S.route] || VIEWS.dashboard;
  const page = document.getElementById('page');
  page.innerHTML = memuat();
  const cg = document.getElementById('cariGlobal'); if (cg) cg.value = '';
  const seq = ++renderSeq;
  try {
    const html = await view(S.params);
    if (seq !== renderSeq) return;
    page.innerHTML = `<div class="fade-in">${html}</div>`;
    if (view.after) view.after(S.params);
    window.scrollTo(0, 0);
  } catch (err) {
    if (seq !== renderSeq) return;
    if (!err.dariServer && !/Koneksi ke server/.test(err.message || '')) laporGalat('Tampilan ' + S.route + ': ' + err.message, err.stack);
    page.innerHTML = `<div class="card p-6 text-center"><p class="text-red-700 font-semibold mb-2">Gagal memuat halaman</p><p class="text-sm text-coklat-500">${e(err.message)}</p>
      <button class="btn btn-ghost mt-4" data-act="muatUlang">Coba lagi</button></div>`;
  }
}
const reload = () => render();
ACT.muatUlang = reload;
function bukaMenu() { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('backdrop').classList.remove('hidden'); }
function tutupMenu() { const s = document.getElementById('sidebar'); if (s) { s.classList.add('-translate-x-full'); document.getElementById('backdrop').classList.add('hidden'); } }
ACT.bukaMenu = bukaMenu; ACT.tutupMenu = tutupMenu;

/* ---------- login & registrasi ---------- */
function simpanSesi(r) { S.token = r.token; S.user = r.user; try { localStorage.setItem(KEY, JSON.stringify({ token: r.token, user: r.user, exp: r.expires_at })); } catch (_) { } }
function keluar(diam) {
  const t = S.token;
  S.token = null; S.user = null;
  try { localStorage.removeItem(KEY); } catch (_) { }
  if (t && !diam) kirimApi({ action: 'auth.logout', token: t, payload: {} }, () => { }, () => { });
  if (diam) toast('Sesi berakhir, silakan login kembali.', 'err');
  location.hash = '';
  renderLogin();
}
ACT.logout = () => keluar(false);

/* ---------- Tema halaman depan (diatur Admin: preset warna + foto/gambar berganti) ---------- */
const TEMA_WARNA = { coklat: ['#1f1b17', '#5d4037', '#fbbf24'], hutan: ['#071a0e', '#2e5a36', '#bef264'], senja: ['#2a0f05', '#b45309', '#fde68a'],
  malam: ['#0b1120', '#334155', '#93c5fd'], merahputih: ['#3f0a0a', '#b91c1c', '#fecaca'], laut: ['#04202e', '#0e7490', '#a5f3fc'] };
const TEMA_NAMA = { coklat: 'Coklat Pramuka', hutan: 'Hutan Rimba', senja: 'Senja Perkemahan', malam: 'Api Unggun Malam', merahputih: 'Merah Putih', laut: 'Bahari' };
const TEMA_BAWAAN = { preset: 'coklat', slides: [], interval: 7, efek: 'zoom', gelap: 55, label: 'GERAKAN PRAMUKA · GUGUS DEPAN 01.061–01.062',
  judul: 'Satyaku kudarmakan,\ndarmaku kubaktikan.', subjudul: 'Sistem Informasi Manajemen Kepramukaan Pangkalan YKPI Al-Ittihad Pekanbaru — latihan, kecakapan, surat, kas, hingga LPJ dalam satu tempat.',
  kaki: 'Ambalan Khalid Bin Walid & Al-Khansa', versi: '0' };
function temaAktif() { try { return Object.assign({}, TEMA_BAWAAN, JSON.parse(localStorage.getItem('simpramuka.tema') || 'null') || {}); } catch (_) { return TEMA_BAWAAN; } }
function htmlHero(t, mode) {
  const w = TEMA_WARNA[t.preset] || TEMA_WARNA.coklat, ada = (t.slides || []).length > 0;
  const gaya = `--g1:${w[0]};--g2:${w[1]};--aksen:${w[2]};--gelap:${ada ? (t.gelap || 55) / 100 : 1};--dur:${(t.interval || 7) + 2}s`;
  const slides = (t.slides || []).map((x, i) => `<div class="hero-slide ${i === 0 ? 'aktif' : ''}" data-ket="${e(x.keterangan || '')}"><img src="${e(x.url)}" data-cad="${e(x.cadangan || '')}" alt="" ${i ? 'loading="lazy"' : ''} referrerpolicy="no-referrer"></div>`).join('');
  const judul = e(t.judul || '').replace(/\n/g, '<br>');
  const titik = ada && t.slides.length > 1 ? `<div class="hero-titik">${t.slides.map((_, i) => `<button type="button" class="${i === 0 ? 'aktif' : ''}" data-i="${i}" aria-label="Gambar ${i + 1}"></button>`).join('')}</div>` : '';
  const ket = ada ? `<p class="hero-ket text-xs text-white/80 mt-2">${e(t.slides[0].keterangan || '')}</p>` : '';
  if (mode === 'pita') return `<div class="hero-tema efek-${t.efek} ${ada ? '' : 'tanpa-foto'} min-h-[230px]" style="${gaya}" data-interval="${t.interval || 7}">${slides}<div class="hero-overlay"></div>
    <div class="hero-isi p-5 pt-6 flex flex-col justify-between min-h-[230px]"><div class="flex items-center gap-2"><img src="${LOGO.tunas}" class="h-10 bg-white/90 rounded-lg p-1" alt=""><img src="${LOGO.wosm}" class="h-10 rounded-lg" alt=""><div class="ml-1"><div class="font-display text-lg font-extrabold leading-tight">SIM-Pramuka</div><div class="text-[11px] text-white/80">Gudep 01.061–01.062</div></div></div>
    <div class="mt-6"><p class="hero-aksen font-semibold tracking-widest text-[10px] mb-1">${e(t.label)}</p><h1 class="font-display text-2xl font-bold leading-tight">${judul}</h1>${ket}<div class="mt-3">${titik}</div></div></div></div>`;
  return `<div class="hero-tema efek-${t.efek} ${ada ? '' : 'tanpa-foto'} ${mode === 'pratinjau' ? 'h-full min-h-[340px] rounded-2xl' : 'min-h-screen h-full'}" style="${gaya}" data-interval="${t.interval || 7}">${slides}<div class="hero-overlay"></div>
    <div class="hero-isi h-full ${mode === 'pratinjau' ? 'min-h-[340px] p-6' : 'min-h-screen p-12'} flex flex-col justify-between">
      <div class="flex items-center gap-3"><img src="${LOGO.tunas}" class="${mode === 'pratinjau' ? 'h-9' : 'h-12'} bg-white/90 rounded-xl p-1" alt=""><img src="${LOGO.wosm}" class="${mode === 'pratinjau' ? 'h-9' : 'h-12'} rounded-xl" alt=""></div>
      <div>
        <p class="hero-aksen font-semibold tracking-widest text-xs mb-3">${e(t.label)}</p>
        <h1 class="font-display ${mode === 'pratinjau' ? 'text-3xl' : 'text-5xl'} font-bold leading-tight mb-4 drop-shadow">${judul}</h1>
        <p class="text-white/85 max-w-md ${mode === 'pratinjau' ? 'text-sm' : ''}">${e(t.subjudul)}</p>
      </div>
      <div class="flex items-end justify-between gap-4"><div><p class="text-xs text-white/75">${e(t.kaki)}</p>${ket}</div>${titik}</div>
    </div></div>`;
}
/** Jalankan pergantian gambar pada hero yang tampil (login & pratinjau). Timer berhenti sendiri bila hero dilepas dari halaman. */
function pasangHero(akar) {
  (akar || document).querySelectorAll('.hero-tema:not([data-jalan])').forEach(h => {
    h.dataset.jalan = '1';
    const imgs = h.querySelectorAll('.hero-slide img');
    imgs.forEach(img => { img.onerror = () => { if (img.dataset.cad && img.src !== img.dataset.cad) img.src = img.dataset.cad; else img.closest('.hero-slide').classList.add('gagal'); }; });
    const slides = [...h.querySelectorAll('.hero-slide')];
    if (slides.length < 2) return;
    let i = 0;
    const ke = (n) => {
      const hidup = slides.filter(x => !x.classList.contains('gagal'));
      if (!hidup.length) return;
      i = ((n % slides.length) + slides.length) % slides.length;
      if (slides[i].classList.contains('gagal')) i = slides.indexOf(hidup[0]);
      slides.forEach((x, j) => { x.classList.toggle('aktif', j === i); if (j === i) { const im = x.querySelector('img'); im.style.animation = 'none'; void im.offsetWidth; im.style.animation = ''; } });
      h.querySelectorAll('.hero-titik button').forEach((b, j) => b.classList.toggle('aktif', j === i));
      const k = h.querySelector('.hero-ket'); if (k) k.textContent = slides[i].dataset.ket || '';
    };
    h.querySelectorAll('.hero-titik button').forEach(b => b.onclick = () => { ke(Number(b.dataset.i)); });
    const tm = setInterval(() => { if (!document.body.contains(h)) return clearInterval(tm); ke(i + 1); }, (Number(h.dataset.interval) || 7) * 1000);
  });
}
/** Ambil tema terbaru dari server; tampilan diperbarui hanya bila berubah (versi). */
function muatTema() {
  call('tema.get').then(t => {
    const lama = temaAktif();
    try { localStorage.setItem('simpramuka.tema', JSON.stringify(t)); } catch (_) { }
    if (String(lama.versi) === String(t.versi)) return;
    const a = document.getElementById('heroLogin'), b = document.getElementById('heroPita');
    if (a) a.innerHTML = htmlHero(t, 'penuh');
    if (b) b.innerHTML = htmlHero(t, 'pita');
    pasangHero();
  }).catch(() => { });
}

function renderLogin(tab = 'login') {
  const reg = tab === 'daftar';
  document.getElementById('app').innerHTML = `
  <div class="min-h-screen grid lg:grid-cols-2">
    <div id="heroLogin" class="hidden lg:block relative">${htmlHero(temaAktif(), 'penuh')}</div>
    <div class="flex flex-col lg:items-center lg:justify-center lg:p-10">
      <div id="heroPita" class="lg:hidden">${htmlHero(temaAktif(), 'pita')}</div>
      <div class="w-full max-w-md mx-auto p-5 sm:p-8 lg:p-0">
        <div id="peringatanSetup"></div>
        <div class="flex gap-1 bg-coklat-100 rounded-xl p-1 mb-6">
          <button class="tab flex-1 ${!reg ? 'aktif' : ''}" data-act="tabLogin" data-id="login">Masuk</button>
          <button class="tab flex-1 ${reg ? 'aktif' : ''}" data-act="tabLogin" data-id="daftar">Daftar Akun</button>
        </div>
        ${reg ? formDaftar() : formLogin()}
      </div>
    </div>
  </div>`;
  cekSetup();
  pasangHero();
  muatTema();
  const f = document.getElementById('fAuth');
  if (reg) {
    const role = f.querySelector('[name=role]');
    const sync = () => f.querySelectorAll('[data-anggota]').forEach(x => x.classList.toggle('hidden', role.value !== 'anggota'));
    role.onchange = sync; sync();
  }
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const d = formData(f);
    const btn = f.querySelector('button[type=submit]');
    if (reg) {
      const r = await aksi(btn, () => call('auth.register', d)).catch(() => null);
      if (r) { toast(r.pesan, 'ok'); renderLogin('login'); }
    } else {
      d.ua = navigator.userAgent;
      const r = await aksi(btn, () => call('auth.login', d)).catch(() => null);
      if (r) { simpanSesi(r); parseHash(); render(); }
    }
  };
}
ACT.tabLogin = (el) => renderLogin(el.dataset.id);
function formLogin() {
  return `<form id="fAuth" class="space-y-4" novalidate>
    <h2 class="font-display text-2xl font-bold">Masuk</h2>
    ${fld('Username', '<input class="inp" name="username" autocomplete="username" required autocapitalize="none">')}

function boot() {
  try {

    if (s && s.token && (!s.exp || s.exp > Date.now())) { S.token = s.token; S.user = s.user; }

  parseHash();

}

/** QR code (pustaka qrcode-generator, cdnjs). */
function gambarQr(el, teks, sel = 4) {
  if (!window.qrcode) { el.innerHTML = '<div class="text-[9px] text-center text-coklat-500 pt-6">QR</div>'; return; }
  const q = qrcode(0, 'M'); q.addData(teks); q.make();
  el.innerHTML = q.createSvgTag({ cellSize: sel, margin: 0, scalable: true });
  const svg = el.querySelector('svg'); if (svg) { svg.style.width = '100%'; svg.style.height = '100%'; }
}

/** Baca file materi → data URL (gambar dikompres; dokumen lain apa adanya; maks 8 MB). */
async function berkasMateri(file) {
  if (file.size > 8 * 1024 * 1024) throw new Error(`"${file.name}" lebih dari 8 MB. Unggah ke Google Drive lalu masukkan tautannya.`);
  if (/^image\//.test(file.type) && !/gif|svg/.test(file.type)) return kompresFoto(file, 2000, 0.85);
  const url = await bacaFile(file);
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const mime = { pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    ppt: 'application/vnd.ms-powerpoint', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', xls: 'application/vnd.ms-excel',
    xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', txt: 'text/plain', mp3: 'audio/mpeg', mp4: 'video/mp4', json: 'application/json', csv: 'text/csv' }[ext];
  return mime ? url.replace(/^data:[^;]*;/, 'data:' + mime + ';') : url;
}
const judulDariNama = (n) => n.replace(/\.[a-z0-9]+$/i, '').replace(/[_+]+/g, ' ').replace(/\s+/g, ' ').trim();

function bacaJsonMateri(teks) {
  let j;
  try { j = JSON.parse(String(teks).replace(/^﻿/, '')); } catch (err) { throw new Error('Format JSON tidak valid: ' + err.message); }
  if (j && !Array.isArray(j) && Array.isArray(j.materi)) j = j.materi;
  if (j && !Array.isArray(j) && typeof j === 'object') j = [j];
  if (!Array.isArray(j) || !j.length) throw new Error('JSON harus berisi daftar materi: [ { "judul": …, "kategori": …, "url": … } ]');
  return j;
}

function pesertaRow(r = {}) {
  return `<div class="grid grid-cols-12 gap-2 items-center" data-peserta>

}

function formSuratHtml(t, data = {}, gudep) {
  const fields = t.fields.map(f => {
    const v = data[f.key] || '';
    if (f.type === 'peserta') return `<div><label class="lbl">${e(f.label)}${f.required ? ' <span class="text-red-600">*</span>' : ''}</label>
      <div class="space-y-2" data-plist>${(Array.isArray(v) && v.length ? v : [{}]).map(pesertaRow).join('')}</div>
      <button type="button" class="btn btn-ghost btn-sm mt-2" data-act="tambahPeserta">+ Tambah baris</button></div>`;
    if (f.type === 'textarea') return fld(e(f.label) + (f.required ? ' <span class="text-red-600">*</span>' : ''), `<textarea class="inp" name="${f.key}" rows="3" placeholder="${e(f.placeholder || '')}">${e(v)}</textarea>`);
    return fld(e(f.label) + (f.required ? ' <span class="text-red-600">*</span>' : ''), inp(f.key, v, `placeholder="${e(f.placeholder || '')}"`));
  }).join('');
  return `${fld('Gugus Depan pengirim (menentukan kop & penandatangan)', `<select class="inp" name="__gudep">${opsi([['GABUNGAN', 'Gabungan 01.061–01.062 (TTD Ka Gudep Putra)'], ['01.061', '01.061 · Putra'], ['01.062', '01.062 · Putri']], gudep || (S.user.gudep === '01.062' ? '01.062' : 'GABUNGAN'))}</select>`)}
    ${fields}
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="MENGETAHUI" data-bool ${data.MENGETAHUI === 'YA' ? 'checked' : ''}> Sertakan kolom "Mengetahui" Majelis Pembimbing Gugus Depan</label>`;
}
function ambilDataSurat(form, t) {
  const d = formData(form);
  const gudep = d.__gudep; delete d.__gudep;
  t.fields.filter(f => f.type === 'peserta').forEach(f => {
    d[f.key] = [...form.querySelectorAll('[data-peserta]')].map(r => ({ nama: r.querySelector('[data-f=nama]').value.trim(), jabatan: r.querySelector('[data-f=jabatan]').value.trim(), satuan: r.querySelector('[data-f=satuan]').value.trim() })).filter(r => r.nama || r.jabatan);
  });
  t.fields.forEach(f => { if (f.required && f.type !== 'peserta' && !d[f.key]) throw new Error(f.label + ' wajib diisi.'); });
  return { gudep, data: d };
}

    const { gudep, data } = ambilDataSurat(form, t);

VIEWS.da = async (p) => {
  const d = C.da = await call('da.struktur', { masa_bakti: p.mb || '' });
  const jab = {};
  d.jabatan.forEach(j => jab[j.jabatan_id] = j);
  const grup = {};
  d.pengurus.filter(x => x.aktif === 'YA' || d.masa_bakti !== d.masa_list[0] || true).forEach(x => { const j = jab[x.jabatan_id] || { kelompok: 'Lainnya', urutan: 99 }; (grup[j.kelompok] = grup[j.kelompok] || []).push(x); });
  const urutK = Object.keys(grup).sort((a, b) => Math.min(...grup[a].map(x => Number((jab[x.jabatan_id] || {}).urutan) || 99)) - Math.min(...grup[b].map(x => Number((jab[x.jabatan_id] || {}).urutan) || 99)));
  const kelola = d.bisa_kelola;
  return judulHalaman('Dewan Ambalan', `Struktur Masa Bakti ${e(d.masa_bakti)} beserta job desc &amp; hak akses aplikasi.`,
    `<select class="inp w-auto" data-act-change="gantiMB">${opsi(d.masa_list, d.masa_bakti)}</select>` + (kelola ? `<button class="btn btn-ghost" data-act="mbBaru">Masa Bakti Baru</button><button class="btn btn-primary" data-act="daTetap">Tetapkan Pengurus</button>` : '')) +
  (urutK.length ? urutK.map(k => `<h2 class="font-display text-lg font-bold mt-6 mb-3">${e(k)}</h2><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">${grup[k]
    .sort((a, b) => (Number((jab[a.jabatan_id] || {}).urutan) || 99) - (Number((jab[b.jabatan_id] || {}).urutan) || 99)).map(x => `<div class="card p-4 flex items-center gap-3 ${x.aktif === 'YA' ? '' : 'opacity-60'}">
      ${avatar({ foto_url: x.foto_url, nama: x.nama }, 'w-12 h-12')}<div class="min-w-0 flex-1"><div class="font-semibold text-sm leading-snug">${e(x.nama)}</div>
      <div class="text-xs text-coklat-500">${e((jab[x.jabatan_id] || {}).nama_jabatan || x.jabatan_id)}</div><div class="text-[10px] text-coklat-400 font-mono">${e(x.nta || '')}</div>
      ${!x.punya_akun ? '<span class="chip chip-abu mt-1">belum punya akun</span>' : ''}</div>
      ${kelola && x.aktif === 'YA' ? `<button class="text-coklat-300 hover:text-red-600 text-lg" title="Lepas jabatan" data-act="daLepas" data-id="${x.pengurus_id}">&times;</button>` : ''}</div>`).join('')}</div>`).join('') : `<div class="card">${kosong('Belum ada pengurus pada masa bakti ini.')}</div>`) +
  `<h2 class="font-display text-lg font-bold mt-8 mb-3">Job Desc &amp; Wewenang di Aplikasi</h2>
  <div class="card overflow-hidden"><div class="scroll-x"><table class="tbl"><thead><tr><th>Jabatan</th><th>Job desc</th><th>Hak akses tambahan</th>${kelola ? '<th></th>' : ''}</tr></thead><tbody>
  ${d.jabatan.map(j => `<tr><td class="font-semibold whitespace-nowrap">${e(j.nama_jabatan)}</td><td class="text-xs">${e(j.job_desc)}</td>
    <td>${(j.permissions || '').split(',').filter(Boolean).map(pm => `<span class="chip chip-biru m-0.5" title="${e(d.permissions[pm] || '')}">${e(pm)}</span>`).join('') || '<span class="text-xs text-coklat-400">akses anggota</span>'}</td>
    ${kelola ? `<td><button class="btn btn-ghost btn-sm" data-act="jabForm" data-id="${j.jabatan_id}">Atur</button></td>` : ''}</tr>`).join('')}</tbody></table></div></div>`;
};

  }).catch(err => { kw.innerHTML = `<p class="text-sm text-red-700">${e(err.message)}</p>`; });

};
ACT.pjForm = (el) => {

    ${fld('Nama & gelar', inp('nama', x.nama))}${fld('Jabatan (tercetak di dokumen)', inp('jabatan', x.jabatan, 'required'))}
    <div class="grid grid-cols-2 gap-3">${fld('NTA', inp('nta', x.nta))}${fld('Urutan', inp('urutan', x.urutan, 'inputmode="numeric"'))}</div>
    ${fld('Keterangan', inp('keterangan', x.keterangan))}
    ${fld('Status', `<select class="inp" name="aktif">${opsi([['YA', 'Aktif'], ['TIDAK', 'Nonaktif']], x.aktif || 'YA')}</select>`)}
    ${fld('Tanda tangan (PNG transparan disarankan / JPG)', '<input type="file" class="inp" id="inTtd" accept="image/png,image/jpeg"><img id="pvTtd" class="hidden max-h-16 mt-2" alt="">', 'Disisipkan otomatis hanya pada dokumen yang sudah disahkan di aplikasi.')}
    ${x.punya_ttd ? '<label class="flex items-center gap-2 text-sm"><input type="checkbox" name="hapus_ttd" value="1"> Hapus TTD tersimpan</label>' : ''}`,
  { onOpen: (f) => { f.querySelector('#inTtd').onchange = async (ev) => { const file = ev.target.files[0]; if (!file) return; if (!/image\/(png|jpeg)/.test(file.type)) return toast('TTD harus PNG/JPG', 'err'); f._ttd = await bacaFile(file); const pv = f.querySelector('#pvTtd'); pv.src = f._ttd; pv.classList.remove('hidden'); }; },
    onSubmit: async (d, f) => { if (f._ttd) d.ttd_base64 = f._ttd; if (x.baru) d.baru = true; else d.kode = x.kode; d.hapus_ttd = !!d.hapus_ttd; await call('pejabat.simpan', d); toast('Data pejabat disimpan', 'ok'); reload(); } });
};
ACT.tesWa = (el) => aksi(el, () => call('notif.tes')).then(r => r.status === 'TERKIRIM' ? toast('Pesan tes terkirim ke nomor Anda', 'ok') : r.wa_link ? (toast('Gateway belum aktif — membuka WhatsApp', 'ok'), window.open(r.wa_link, '_blank')) : toast('Status: ' + r.status, 'err')).catch(() => { });
ACT.pjHapus = async (el) => { if (await konfirmasi('Hapus pejabat ini?')) aksi(el, () => call('pejabat.hapus', { kode: el.dataset.id }), 'Pejabat dihapus').then(reload).catch(() => { }); };

/* ============================== PROFIL ============================== */
VIEWS.profil = async () => {
  const u = S.user = await call('auth.me');
  return judulHalaman('Profil Saya', '') + `<div class="grid lg:grid-cols-2 gap-4">
  <form class="card p-5 space-y-3" id="fProfil"><div class="flex items-center gap-4">${avatar(u, 'w-16 h-16')}<label class="btn btn-ghost btn-sm cursor-pointer">Ganti foto<input type="file" accept="image/*" class="hidden" id="inProfil"></label></div>
    ${fld('Nama lengkap', inp('nama_lengkap', u.nama_lengkap, 'required'))}${fld('Email', inp('email', u.email, 'type="email"'))}
    <div class="grid grid-cols-2 gap-3">${fld('No. HP', inp('no_hp', u.no_hp))}${fld('Kelas', inp('kelas', u.kelas))}${fld('Tempat lahir', inp('tempat_lahir', u.tempat_lahir))}${fld('Tanggal lahir', inp('tgl_lahir', u.tgl_lahir, 'type="date"'))}
      ${fld('Agama (menentukan butir SKU no. 1)', `<select class="inp" name="agama">${opsi([['', '— pilih —'], 'Islam', 'Katolik', 'Protestan', 'Hindu', 'Buddha'], u.agama)}</select>`)}</div>
    <a href="#/formulir" class="text-xs underline text-coklat-600">Lengkapi Formulir Data Anggota (cetak DOCX/PDF) →</a>
    <div class="text-xs text-coklat-500">Username <b>${e(u.username)}</b> · Gudep ${e(u.gudep)} · ${e(u.tingkatan || u.role)} · NTA ${e(u.nta || '-')}</div>
    <button class="btn btn-primary" type="submit">Simpan Profil</button></form>
  <form class="card p-5 space-y-3" id="fPw"><h3 class="font-display font-bold">Ganti Password</h3>
    ${fld('Password lama', '<input class="inp" type="password" name="lama" required autocomplete="current-password">')}
    ${fld('Password baru', '<input class="inp" type="password" name="baru" required autocomplete="new-password">', 'Min. 8 karakter, huruf & angka.')}
    ${fld('Ulangi password baru', '<input class="inp" type="password" name="baru2" required autocomplete="new-password">')}
    <button class="btn btn-primary" type="submit">Ganti Password</button></form></div>`;
};
VIEWS.profil.after = () => {
  const f = document.getElementById('fProfil'), pw = document.getElementById('fPw');
  f.querySelector('#inProfil').onchange = async (ev) => { try { f._foto = await kompresFoto(ev.target.files[0], 600, .85); f.querySelector('img,div').outerHTML = `<img src="${f._foto}" class="w-16 h-16 rounded-full object-cover">`; } catch (err) { toast(err.message, 'err'); } };
  f.onsubmit = async (ev) => { ev.preventDefault(); const d = formData(f); if (f._foto) d.foto_base64 = f._foto;
    const u = await aksi(f.querySelector('[type=submit]'), () => call('auth.updateProfil', d), 'Profil disimpan').catch(() => null);
    if (u) { S.user = u; simpanSesi({ token: S.token, user: u }); render(); } };
  pw.onsubmit = async (ev) => { ev.preventDefault(); await aksi(pw.querySelector('[type=submit]'), () => call('auth.gantiPassword', formData(pw)), 'Password diganti').then(() => pw.reset()).catch(() => { }); };

  <script>
/* ===================================================================
 * SIM-Pramuka — halaman tambahan: SKK/TKK resmi, Proposal → LPJ Kegiatan,
 * Penegak Garuda, Laporan & Rekap, Formulir Anggota.
 * =================================================================== */

/* ---------- gambar TKK resmi (dimuat sekali, disimpan di sessionStorage) ---------- */
async function muatGambarTkk() {
  if (C.tkkImg) return C.tkkImg;
  try { const s = sessionStorage.getItem('tkk.v1'); if (s) return (C.tkkImg = JSON.parse(s)); } catch (_) { }
  C.tkkImg = await call('skk.gambar').catch(() => ({}));
  try { sessionStorage.setItem('tkk.v1', JSON.stringify(C.tkkImg)); } catch (_) { }
  return C.tkkImg;
}
/** Lencana TKK sesuai bentuk resmi: Purwa lingkaran, Madya bujur sangkar, Utama segi lima — bingkai kuning (Penegak). */
function lencanaTkk(src, tingkat, size = 44) {
  const clip = { PURWA: 'circle(50% at 50% 50%)', MADYA: 'none', UTAMA: 'polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%)' }[tingkat] || 'none';
  const pad = 3;
  return `<span class="inline-block flex-none" style="width:${size}px;height:${size}px;background:#eab308;clip-path:${clip};padding:${pad}px" title="${e(tingkat || '')}">
    <img src="${src || ''}" style="width:100%;height:100%;object-fit:cover;clip-path:${clip}" alt=""></span>`;
}
const WARNA_TKK = { Kuning: '#facc15', Merah: '#dc2626', Putih: '#ffffff', Hijau: '#16a34a', Biru: '#2563eb' };

/* ============================== SKK / TKK ============================== */
async function viewSkk() {
  const [d, img] = await Promise.all([call('skk.list'), muatGambarTkk()]);
  C.skk = d;
  const prog = {};
  d.progress.forEach(x => (prog[x.skk_id] = prog[x.skk_id] || []).push(x));
  const best = (id) => { const l = (prog[id] || []).filter(x => x.status === 'LULUS').map(x => x.tingkat); return l.includes('UTAMA') ? 'UTAMA' : l.includes('MADYA') ? 'MADYA' : l.includes('PURWA') ? 'PURWA' : ''; };
  const penguji = can('kecakapan.uji');
  const milik = d.progress.filter(x => x.status === 'LULUS');
  const per = { I: 0, II: 0, III: 0, IV: 0, V: 0 };
  d.master.forEach(s => { if (best(s.skk_id)) per[s.bidang_kode]++; });
  const ket = `<details class="card p-4 mb-4"><summary class="font-display font-bold flex items-center justify-between">Ketentuan resmi SKK &amp; TKK (SK Kwarnas 134/KN/76 &amp; 132/1979)<span class="text-xs text-coklat-400">buka</span></summary>
    <div class="grid md:grid-cols-2 gap-4 mt-3 text-sm">${d.ketentuan.map(k => `<div><div class="font-semibold mb-1">${e(k[0])}</div><ul class="list-disc pl-5 space-y-1 text-coklat-700">${k[1].map(t => `<li>${e(t)}</li>`).join('')}</ul></div>`).join('')}
    <div><div class="font-semibold mb-1">Bentuk lencana</div><div class="flex gap-4 items-end">${['PURWA', 'MADYA', 'UTAMA'].map(t => `<div class="text-center text-xs">${lencanaTkk(img['IV.4'], t, 52)}<div class="mt-1">${t[0] + t.slice(1).toLowerCase()}<br><span class="text-coklat-400">${e(d.bentuk[t])}</span></div></div>`).join('')}</div></div></div></details>`;
  const ring = `<div class="card p-4 mb-4 flex flex-wrap items-center gap-4"><div><div class="text-xs text-coklat-500">TKK saya</div><div class="text-2xl font-bold">${Object.values(per).reduce((a, b) => a + b, 0)}</div></div>
    ${Object.keys(d.bidang).map(k => `<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full border border-coklat-300" style="background:${WARNA_TKK[d.bidang[k][1]]}"></span><span class="text-xs">${k}: <b>${per[k]}</b></span></div>`).join('')}
    ${!d.boleh_pakai && S.user.role === 'anggota' ? '<div class="w-full text-xs text-red-700">TKK Penegak dapat diajukan/dikenakan setelah dilantik menjadi Penegak Bantara (Pt. 15e). Selesaikan SKU Bantara dahulu.</div>' : ''}
    ${penguji ? '<button class="btn btn-ghost btn-sm ml-auto" data-act="skkBaru">+ Tambah SKK (SK terbaru)</button>' : ''}</div>`;
  const saya = milik.length ? `<div class="card p-4 mb-4"><div class="lbl">Surat Pernyataan Lulus TKK saya</div><div class="space-y-2">${milik.map(x => { const s = d.master.find(m => m.skk_id === x.skk_id) || {};
    return `<div class="flex flex-wrap items-center gap-3 text-sm">${lencanaTkk(img[s.kode_gambar], x.tingkat, 36)}<span class="flex-1">${e(s.nama)} · ${e(x.tingkat)} · ${tgl(x.tanggal_selesai)} · ${e(x.penguji_nama)}${x.penguji2_nama ? ' & ' + e(x.penguji2_nama) : ''}</span>${tombolUnduh('skk.unduhSurat', { id: x.id })}</div>`; }).join('')}</div></div>` : '';
  const cari = `<input class="inp mb-3 max-w-sm" id="cariSkk" placeholder="Cari SKK… (mis. PPPK, Juru Masak)">`;
  const daftar = Object.keys(d.bidang).map(bk => {
    const list = d.master.filter(s => s.bidang_kode === bk);
    return `<h3 class="font-display font-bold mt-6 mb-2 flex items-center gap-2"><span class="w-4 h-4 rounded border border-coklat-300" style="background:${WARNA_TKK[d.bidang[bk][1]]}"></span>Bidang ${bk} — ${e(d.bidang[bk][0])} <span class="text-xs font-normal text-coklat-400">(${list.length})</span></h3>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">${list.map(s => {
      const b = best(s.skk_id), ps = prog[s.skk_id] || [], aju = ps.find(x => x.status === 'DIAJUKAN');
      return `<button class="card p-3 flex items-center gap-3 text-left hover:border-coklat-400" data-act="skkDetail" data-id="${s.skk_id}" data-cari="${e((s.nama + ' ' + s.kode_gambar + ' ' + s.nama.split(/[\s/()-]+/).filter(Boolean).map(w => w[0]).join('')).toLowerCase())}">
        ${img[s.kode_gambar] ? lencanaTkk(img[s.kode_gambar], b || 'MADYA', 46) : `<span class="w-11 h-11 rounded grid place-items-center text-xs" style="background:${WARNA_TKK[s.warna]}">${e(s.nama.slice(0, 2))}</span>`}
        <div class="min-w-0 flex-1"><div class="font-semibold text-sm leading-snug">${e(s.nama)}</div><div class="text-[11px] text-coklat-400">No. gambar ${e(s.kode_gambar || '-')}${s.wajib_gudep === 'YA' ? ' · <b class="text-red-700">wajib Gudep</b>' : ''}</div>
        <div class="flex gap-1 mt-1">${['PURWA', 'MADYA', 'UTAMA'].map(t => `<span class="chip ${ps.some(x => x.tingkat === t && x.status === 'LULUS') ? 'chip-hijau' : ps.some(x => x.tingkat === t && x.status === 'DIAJUKAN') ? 'chip-kuning' : 'chip-abu'}">${t[0]}</span>`).join('')}${aju ? '<span class="text-[10px] text-tunas-600">diajukan</span>' : ''}</div></div></button>`;
    }).join('')}</div>`;
  }).join('');
  return ket + ring + saya + cari + `<div id="skkList">${daftar}</div>`;
}
document.addEventListener('input', (ev) => {
  if (ev.target.id !== 'cariSkk') return;
  const q = ev.target.value.toLowerCase();
  document.querySelectorAll('#skkList [data-cari]').forEach(b => b.classList.toggle('hidden', q && !b.dataset.cari.includes(q)));
});
function syaratHtml(t) {
  const [umum, penegak] = String(t || '-').split(' || ');
  const butir = (x) => x.split(/,?\s(?=[a-z]\)\s)/).map(z => `<li>${e(z.trim())}</li>`).join('');
  return `<ul class="space-y-1 list-none">${butir(umum)}</ul>${penegak ? `<div class="mt-2 p-2 rounded-lg bg-tunas-400/15"><div class="text-[11px] font-bold">Khusus Pramuka Penegak &amp; Pandega, ditambah:</div><ul class="list-none">${butir(penegak)}</ul></div>` : ''}`;
}
ACT.skkDetail = (el) => {
  const d = C.skk, s = d.master.find(m => m.skk_id === el.dataset.id), img = C.tkkImg || {};
  const ps = d.progress.filter(x => x.skk_id === s.skk_id);
  const anggota = S.user.role === 'anggota';
  modal('SKK ' + s.nama, `<div class="flex items-center gap-4">${['PURWA', 'MADYA', 'UTAMA'].map(t => `<div class="text-center text-[11px]">${lencanaTkk(img[s.kode_gambar], t, 58)}<div>${t[0] + t.slice(1).toLowerCase()}</div></div>`).join('')}
      <div class="text-xs text-coklat-500">Bidang ${e(s.bidang_kode)} — ${e(s.bidang)}<br>Warna dasar <b>${e(s.warna)}</b> · bingkai kuning<br>No. gambar ${e(s.kode_gambar || '-')}<br>${e(s.keterangan || '')}<br><a class="underline" href="#/materi?rel=SKK">Materi & ketentuan SKK</a></div></div>
    ${['PURWA', 'MADYA', 'UTAMA'].map(t => { const x = ps.find(p => p.tingkat === t);
      return `<div class="border border-coklat-100 rounded-xl p-3"><div class="flex justify-between items-center mb-1"><b>Tingkat ${t[0] + t.slice(1).toLowerCase()}</b>${x ? chipStatus(x.status) : ''}</div>
      <div class="text-sm text-coklat-700">${syaratHtml(s['syarat_' + t.toLowerCase()])}</div>
      ${x && x.catatan && x.status !== 'LULUS' ? `<div class="text-xs text-red-700 mt-1">${e(x.catatan)}</div>` : ''}
      ${anggota && d.boleh_pakai && (!x || x.status === 'PROSES') ? `<button type="button" class="btn btn-tunas btn-sm mt-2" data-act="skkAjukan" data-id="${s.skk_id}" data-t="${t}">Ajukan uji ${t[0] + t.slice(1).toLowerCase()}</button>` : ''}</div>`; }).join('')}
    ${can('kecakapan.uji') ? `<div class="flex gap-2"><button type="button" class="btn btn-ghost btn-sm" data-act="skkWajib" data-id="${s.skk_id}" data-w="${s.wajib_gudep === 'YA' ? '' : '1'}">${s.wajib_gudep === 'YA' ? 'Hapus dari TKK wajib Gudep' : 'Jadikan TKK wajib Gudep (syarat Garuda)'}</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="skkBaru" data-id="${s.skk_id}">Ubah syarat</button></div>` : ''}`, { lebar: true });
};
ACT.skkAjukan = (el) => {
  const s = C.skk.master.find(m => m.skk_id === el.dataset.id), t = el.dataset.t;
  modal('Ajukan SKK ' + s.nama + ' — ' + t, `<div class="text-sm">${syaratHtml(s['syarat_' + t.toLowerCase()])}</div>
    ${fld('Bukti / keterangan (termasuk Pramuka yang sudah Anda latih)', '<textarea class="inp" name="bukti" rows="3" required></textarea>', 'Penguji: tim 2 orang. Setelah lulus, Surat Pernyataan Lulus & Piagam TKK terbit otomatis.')}`,
  { submit: 'Ajukan', onSubmit: async (d) => { d.skk_id = s.skk_id; d.tingkat = t; await call('skk.ajukan', d); toast('Pengajuan SKK terkirim ke penguji', 'ok'); reload(); } });
};
ACT.skkWajib = (el) => aksi(el, () => call('skk.setWajib', { skk_id: el.dataset.id, wajib: !!el.dataset.w }), 'Disimpan').then(reload).catch(() => { });
ACT.skkBaru = (el) => {
  const s = el.dataset.id ? C.skk.master.find(m => m.skk_id === el.dataset.id) : {};
  modal(s.skk_id ? 'Ubah SKK ' + s.nama : 'Tambah SKK (dari SK Kwarnas terbaru)', `${fld('Nama SKK', inp('nama', s.nama, 'required'))}
    <div class="grid grid-cols-2 gap-3">${fld('Bidang', `<select class="inp" name="bidang_kode">${opsi(Object.keys(C.skk.bidang).map(k => [k, k + ' — ' + C.skk.bidang[k][1]]), s.bidang_kode)}</select>`)}${fld('Kode gambar (opsional)', inp('kode_gambar', s.kode_gambar, 'placeholder="IV.30"'))}</div>
    ${['purwa', 'madya', 'utama'].map(t => fld('Syarat ' + t[0].toUpperCase() + t.slice(1), `<textarea class="inp" name="syarat_${t}" rows="3">${e(s['syarat_' + t])}</textarea>`)).join('')}
    ${fld('Sumber / keterangan', inp('keterangan', s.keterangan, 'placeholder="SK Kwarnas No. … Tahun …"'))}`,
  { lebar: true, onSubmit: async (d) => { if (s.skk_id) d.skk_id = s.skk_id; await call('skk.simpan', d); toast('SKK disimpan', 'ok'); reload(); } });
};

/* ============================== PROPOSAL → LPJ KEGIATAN ============================== */
VIEWS.proposal = async (p) => {
  if (p.id) return detailProposal(p.id);
  const d = C.prop = await call('proposal.list');
  return judulHalaman('Agenda & Proposal Kegiatan', 'Input agenda → proposal lengkap (Word/PDF) → persetujuan Pembina → realisasi dengan nota → dokumentasi & evaluasi → LPJ kegiatan otomatis.',
    d.hak.buat ? `<button class="btn btn-primary" data-act="propForm">${IC.plus.replace('<svg', '<svg class="w-4 h-4"')} Proposal Baru</button>` : '') +
  `<div class="card p-3 mb-4 text-xs text-coklat-600 flex flex-wrap gap-2 items-center">${['DRAFT', 'DIAJUKAN', 'DISETUJUI', 'SELESAI'].map((s, i) => `${i ? '→' : ''} ${chipStatus(s)}`).join(' ')}
    <span class="ml-2">Pembuat: Dewan Ambalan (sesuai jabatan) & Pembina · Editor semua proposal/LPJ: Pradana, Kerani (Kestari), Juru Uang, Pemangku Adat, Pembina.</span></div>` +
  (d.items.length ? `<div class="grid md:grid-cols-2 gap-3">${d.items.map(x => `<a href="#/proposal?id=${x.proposal_id}" class="card p-4 hover:border-coklat-400 block">
    <div class="flex justify-between gap-2"><div class="text-xs text-coklat-500">${tgl(x.tanggal_mulai)} · ${e(x.jenis)} · Gudep ${e(x.gudep === 'GABUNGAN' ? '01.061–062' : x.gudep)}</div>${chipStatus(x.status)}</div>
    <div class="font-display font-bold text-lg mt-1">${e(x.judul)}</div><div class="text-xs text-coklat-500">${e(x.tempat)} · oleh ${e(x.dibuat_nama)}${x.nomor ? ' · <span class="font-mono">' + e(x.nomor) + '</span>' : ''}</div>
    <div class="grid grid-cols-2 gap-2 mt-3 text-xs"><div class="bg-coklat-50 rounded-lg p-2">Anggaran<br><b class="text-sm">${rp(x.total_anggaran)}</b></div><div class="bg-coklat-50 rounded-lg p-2">Realisasi<br><b class="text-sm">${rp(x.realisasi_keluar)}</b></div></div></a>`).join('')}</div>`
    : `<div class="card">${kosong('Belum ada proposal. Mulai dengan menginput agenda kegiatan.')}</div>`);
};

function barisDinamis(id, kolom, rows) {
  const row = (r = {}) => `<div class="grid gap-2 items-start" style="grid-template-columns:${kolom.map(k => k.w || '1fr').join(' ')} 28px" data-row="${id}">
    ${kolom.map(k => k.opsi ? `<select class="inp text-sm" data-f="${k.f}">${opsi(k.opsi, r[k.f])}</select>` : `<input class="inp text-sm" data-f="${k.f}" placeholder="${e(k.l)}" value="${e(r[k.f])}" ${k.num ? 'inputmode="numeric"' : ''}>`).join('')}
    <button type="button" class="text-red-600 text-xl leading-8" data-act="hapusBaris">&times;</button></div>`;
  return `<div class="space-y-2" data-list="${id}" data-tpl="${e(row())}">${(rows && rows.length ? rows : [{}]).map(row).join('')}</div>
    <button type="button" class="btn btn-ghost btn-sm mt-2" data-act="tambahBaris" data-id="${id}">+ Tambah baris</button>`;
}
ACT.hapusBaris = (el) => { const r = el.closest('[data-row]'); const box = r.parentElement; r.remove(); if (box.dataset.list === 'anggaran') hitungAnggaran(); };
ACT.tambahBaris = (el) => { const box = document.querySelector(`[data-list="${el.dataset.id}"]`); box.insertAdjacentHTML('beforeend', box.dataset.tpl); };
const ambilBaris = (form, id) => [...form.querySelectorAll(`[data-row="${id}"]`)].map(r => { const o = {}; r.querySelectorAll('[data-f]').forEach(i => o[i.dataset.f] = i.value.trim()); return o; }).filter(o => Object.values(o).some(v => v && !/^(KAS_ANGGOTA|SUBSIDI_SEKOLAH|SUBSIDI_YAYASAN|DANA_LAIN)$/.test(v)));
const angka = (v) => { let s = String(v || '').replace(/[^\d.,]/g, ''); if (/^\d+(\.\d{3})+(,\d+)?$/.test(s) || /^\d+,\d+$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, ''); return Number(s) || 0; };
function hitungAnggaran() {
  const f = document.querySelector('#modal-root form'); if (!f) return;
  const tot = [...f.querySelectorAll('[data-row="anggaran"]')].reduce((s, r) => s + angka(r.querySelector('[data-f=volume]').value) * angka(r.querySelector('[data-f=harga]').value), 0);
  const sd = [...f.querySelectorAll('[data-row="sumber"]')].reduce((s, r) => s + angka(r.querySelector('[data-f=nominal]').value), 0);
  const el = f.querySelector('#totAng'); if (el) el.innerHTML = `Total anggaran <b>${rp(tot)}</b> · sumber dana <b>${rp(sd)}</b> ${sd && sd !== tot ? `<span class="text-red-700">(${sd < tot ? 'kurang ' + rp(tot - sd) : 'lebih ' + rp(sd - tot)})</span>` : ''}`;
}
document.addEventListener('input', (ev) => { if (ev.target.closest && ev.target.closest('[data-list="anggaran"],[data-list="sumber"]')) hitungAnggaran(); });

    <div class="grid sm:grid-cols-2 gap-3">${fld('Tempat *', inp('tempat', x.tempat, 'required'))}${fld('Penyelenggara', inp('penyelenggara', x.penyelenggara, 'placeholder="Dewan Ambalan Penegak Gudep 01.061–01.062"'))}</div>
    ${fld('Peserta / sasaran peserta', inp('peserta', x.peserta, 'placeholder="Penegak Bantara & Laksana"'))}
    ${sec('2. Pendahuluan')}
    ${fld('Latar belakang *', `<textarea class="inp" name="latar_belakang" rows="4" placeholder="Paragraf dipisah baris baru">${e(x.latar_belakang)}</textarea>`)}
    ${fld('Dasar kegiatan (satu per baris)', `<textarea class="inp" name="dasar" rows="3" placeholder="AD/ART Gerakan Pramuka&#10;UU No. 12 Tahun 2010&#10;Program kerja DA">${e(x.dasar)}</textarea>`)}
    <div class="grid sm:grid-cols-2 gap-3">${fld('Maksud', `<textarea class="inp" name="maksud" rows="3">${e(x.maksud)}</textarea>`)}${fld('Tujuan * (satu per baris)', `<textarea class="inp" name="tujuan" rows="3">${e(x.tujuan)}</textarea>`)}</div>
    ${fld('Sasaran', `<textarea class="inp" name="sasaran" rows="2">${e(x.sasaran)}</textarea>`)}
    ${sec('3. Susunan panitia *')}
    ${barisDinamis('panitia', [{ f: 'jabatan', l: 'Jabatan (Ketua Panitia, Sekretaris, …)' }, { f: 'nama', l: 'Nama' }, { f: 'keterangan', l: 'Keterangan', w: '.7fr' }], x.panitia || [{ jabatan: 'Ketua Panitia' }, { jabatan: 'Sekretaris' }, { jabatan: 'Bendahara' }])}
    ${sec('4. Jadwal acara')}

    ${sec('5. Rincian anggaran *')}

ACT.propStatus = async (el) => {

  if (butuhCatatan) return modal(a === 'REVISI' ? 'Minta Revisi' : 'Tolak Proposal', fld('Catatan', '<textarea class="inp" name="catatan" rows="3" required></textarea>'),
    { onSubmit: async (d) => { await call('proposal.status', { proposal_id: x.proposal_id, aksi: a, catatan: d.catatan }); toast('Tersimpan', 'ok'); reload(); } });
  if (a === 'SETUJUI') return modal('Setujui Proposal', fld('Catatan (opsional)', '<textarea class="inp" name="catatan" rows="2"></textarea>'),

  if (!(await konfirmasi(label))) return;

};

/* ============================== LAPORAN & REKAP ============================== */
VIEWS.laporan = async (p) => {
  const tab = p.tab || 'mingguan';
  let isi = '';
  if (tab === 'mingguan') {
    const d = await call('laporan.mingguan', { tanggal: p.t || today() });
    const geser = (n) => { const x = new Date(d.dari + 'T00:00:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
    isi = `<div class="card p-4 mb-4 flex flex-wrap items-center gap-2"><a class="btn btn-ghost btn-sm" href="#/laporan?tab=mingguan&t=${geser(-7)}">‹ Minggu lalu</a><b class="px-2 text-sm">${e(d.subjudul)}</b><a class="btn btn-ghost btn-sm" href="#/laporan?tab=mingguan&t=${geser(7)}">Minggu depan ›</a>
      <span class="ml-auto">${tombolUnduh('laporan.unduh', { tanggal: d.dari }, ['pdf', 'docx', 'xlsx'])}</span></div>
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4">${[['Latihan', d.ringkas.latihan], ['Selesai', d.ringkas.selesai], ['Pemasukan', rp(d.ringkas.masuk)], ['Pengeluaran', rp(d.ringkas.keluar)], ['Kecakapan disahkan', d.ringkas.kecakapan]].map(([k, v]) => `<div class="card p-3"><div class="text-xs text-coklat-500">${k}</div><div class="text-lg font-bold">${v}</div></div>`).join('')}</div>
    ${d.sections.map((s, n) => `<div class="card overflow-hidden mb-4"><div class="p-3 border-b border-coklat-100 flex flex-wrap justify-between gap-2"><h3 class="font-display font-bold">${e(s.judul)}</h3>${tombolEkspor('lap' + n, d.judul + ' — ' + s.judul, s.kolom, s.baris, { sub: d.subjudul })}</div>
      ${s.baris.length ? `<div class="scroll-x"><table class="tbl"><thead><tr>${s.kolom.map(k => `<th>${e(k)}</th>`).join('')}</tr></thead><tbody>${s.baris.map(r => `<tr>${r.map(c => `<td>${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<p class="p-4 text-sm text-coklat-400">Tidak ada data.</p>`}</div>`).join('')}`;
  } else {
    const d = await call('laporan.kinerja', { dari: p.dari || '', sampai: p.sampai || '' });
    isi = `<form class="card p-4 mb-4 flex flex-wrap items-end gap-2" id="fKin">${fld('Dari', inp('dari', p.dari || '', 'type="date"'))}${fld('Sampai', inp('sampai', p.sampai || '', 'type="date"'))}<button class="btn btn-ghost">Terapkan</button>
      <span class="ml-auto">${tombolUnduh('laporan.unduh', { jenis: 'kinerja', dari: p.dari || '', sampai: p.sampai || '' }, ['pdf', 'docx', 'xlsx'])}</span></form>
      <div class="card overflow-hidden"><div class="p-3 text-xs text-coklat-500 border-b border-coklat-100">${e(d.subjudul)} · ${e(d.catatan)}</div><div class="scroll-x"><table class="tbl"><thead><tr>${d.kolom.map(k => `<th>${e(k)}</th>`).join('')}</tr></thead>
      <tbody>${d.baris.map(r => `<tr>${r.map((c, i) => `<td>${i === r.length - 1 ? `<span class="chip ${/Sangat/.test(c) ? 'chip-hijau' : /Baik/.test(c) ? 'chip-biru' : /Cukup/.test(c) ? 'chip-kuning' : 'chip-merah'}">${e(c)}</span>` : e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  }
  return judulHalaman('Laporan & Rekap', 'Laporan mingguan dan rekap kinerja — unduh PDF, Word, atau Excel ber-kop Gudep.') + tabs([['mingguan', 'Laporan Mingguan'], ['kinerja', 'Rekap Kinerja']], tab, 'tabLap') + isi;
};
ACT.tabLap = (el) => go('laporan', { tab: el.dataset.id });
VIEWS.laporan.after = () => { const f = document.getElementById('fKin'); if (f) f.onsubmit = (ev) => { ev.preventDefault(); const d = formData(f); go('laporan', { tab: 'kinerja', dari: d.dari, sampai: d.sampai }); }; };

/* ============================== FORMULIR ANGGOTA ============================== */
VIEWS.formulir = async (p) => {
  const d = C.form = await call('formulir.get', { user_id: p.uid || '' });
  const uid = p.uid || '';
  const field = (f) => {
    const [k, l, t, wajib] = f, v = d.data[k] || '';
    const lab = e(l) + (wajib ? ' <span class="text-red-600">*</span>' : '');
    if (t === 'textarea') return `<div class="sm:col-span-2">${fld(lab, `<textarea class="inp" name="${k}" rows="2">${e(v)}</textarea>`)}</div>`;
    if (String(t).indexOf('select:') === 0) return fld(lab, `<select class="inp" name="${k}"><option value="">—</option>${opsi(t.slice(7).split('|').map(o => o.split('=')).map(o => [o[0], o[1] || o[0]]), v)}</select>`);
    return fld(lab, inp(k, v, `type="${t === 'date' ? 'date' : 'text'}"`));
  };
  return judulHalaman('Formulir Data Anggota', `${e(d.nama)}${d.updated_at ? ' · terakhir disimpan ' + tgl(d.updated_at.slice(0, 10)) : ''}`, tombolUnduh('formulir.cetak', { user_id: uid }, ['pdf', 'docx'], false)) + `
  <form id="fForm" class="space-y-4">${d.fields.map(g => `<div class="card p-5"><h3 class="font-display font-bold mb-3">${e(g.grup)}</h3><div class="grid sm:grid-cols-2 gap-3">${g.fields.map(field).join('')}</div></div>`).join('')}
  <div class="flex flex-wrap gap-2 justify-end"><button type="button" class="btn btn-ghost" data-act="formDraf">Simpan draf</button><button class="btn btn-primary" type="submit">Simpan</button></div></form>
  <p class="text-xs text-coklat-500 mt-3">Setelah disimpan, unduh formulir siap cetak (kop Gudep, pas foto dari profil, kolom tanda tangan orang tua, Pembina, dan anggota).</p>`;
};
VIEWS.formulir.after = (p) => {
  const f = document.getElementById('fForm');
  const kirim = async (btn, draf) => { const d = formData(f); await aksi(btn, () => call('formulir.simpan', { user_id: p.uid || '', data: d, draf }), draf ? 'Draf disimpan' : 'Formulir tersimpan').then(reload).catch(() => { }); };
  f.onsubmit = (ev) => { ev.preventDefault(); kirim(f.querySelector('[type=submit]'), false); };
  ACT.formDraf = (el) => kirim(el, true);
};

  <script>
