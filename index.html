function muatGambar(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('gambar gagal dimuat')); i.src = src; }); }
function bungkusTeks(ctx, teks, maxW) {
  const kata = String(teks || '').split(/\s+/), baris = []; let cur = '';
  kata.forEach(k => { const t = cur ? cur + ' ' + k : k; if (ctx.measureText(t).width > maxW && cur) { baris.push(cur); cur = k; } else cur = t; });
  if (cur) baris.push(cur); return baris;
}
/** Gambar poster buletin di canvas (1080×1350 feed / 1080×1920 story) — logo resmi Tunas Kelapa, palet Coklat Pembina & amber. */
async function gambarPoster(cv, b, fmt) {
  if (!cv) return;
  try { await document.fonts.load('800 60px "Plus Jakarta Sans"'); await document.fonts.load('600 30px "Plus Jakarta Sans"'); } catch (_) { }
  const F = '"Plus Jakarta Sans", Arial, sans-serif';
  const W = 1080, H = fmt === 'story' ? 1920 : 1350, x = cv.getContext('2d'), s = b.statistik || {};

  }
  let g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(44,22,14,.55)'); g.addColorStop(.42, 'rgba(68,42,34,.55)'); g.addColorStop(1, 'rgba(44,22,14,.96)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const M = 72;
  // kepala: logo + identitas + edisi
  const logo = await muatGambar(LOGO.tunas);
  x.fillStyle = '#fff'; x.beginPath(); x.roundRect ? x.roundRect(M, M, 96, 96, 18) : x.rect(M, M, 96, 96); x.fill();
  const lr = Math.min(70 / logo.width, 80 / logo.height); x.drawImage(logo, M + 48 - logo.width * lr / 2, M + 48 - logo.height * lr / 2, logo.width * lr, logo.height * lr);
  x.fillStyle = '#fff'; x.font = `800 34px ${F}`; x.fillText('AMBALAN KHALID BIN WALID · AL-KHANSA', M + 120, M + 42);
  x.fillStyle = '#e7bdb1'; x.font = `600 26px ${F}`; x.fillText('Gudep 01.061–01.062 · Pangkalan YKPI Al-Ittihad', M + 120, M + 82);
  x.font = `800 26px ${F}`; const ed = String(b.edisi || '').toUpperCase(), ew = x.measureText(ed).width + 44;
  x.fillStyle = '#d97706'; x.fillRect(W - M - ew, M + 160, ew, 52); x.fillStyle = '#fff'; x.fillText(ed, W - M - ew + 22, M + 196);
  // judul
  let y = fmt === 'story' ? 780 : 560;
  x.fillStyle = '#fe932c'; x.fillRect(M, y - 12, 56, 5); x.font = `800 28px ${F}`; x.fillText(String(b.tema || 'BULETIN AMBALAN').toUpperCase(), M + 76, y);
  y += 30; x.fillStyle = '#fff'; x.font = `800 ${fmt === 'story' ? 92 : 84}px ${F}`;
  const jb = bungkusTeks(x, String(b.judul || '').toUpperCase(), W - 2 * M).slice(0, 4);
  jb.forEach(l => { y += fmt === 'story' ? 96 : 88; x.fillText(l, M, y); });
  x.font = `500 34px ${F}`; x.fillStyle = '#f9efe8';
  bungkusTeks(x, b.subjudul || '', W - 2 * M).slice(0, 3).forEach(l => { y += 50; x.fillText(l, M, y); });
  // panel statistik
  y += 50;
  const st = [['LATIHAN', s.latihan || 0], ['KEHADIRAN', (s.kehadiran || 0) + '%'], ['TKK & SKU', (s.tkk || 0) + ' · ' + (s.sku || 0)]];
  x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(M, y, W - 2 * M, 130);
  st.forEach((t, i) => { const cx = M + 32 + i * ((W - 2 * M) / 3); x.fillStyle = '#e7bdb1'; x.font = `700 22px ${F}`; x.fillText(t[0], cx, y + 46); x.fillStyle = '#fff'; x.font = `800 44px ${F}`; x.fillText(String(t[1]), cx, y + 100); });
  if ((s.prestasi || []).length) { y += 180; x.fillStyle = '#fbbf24'; x.font = `700 30px ${F}`; bungkusTeks(x, '🏆 ' + s.prestasi[0], W - 2 * M).slice(0, 2).forEach(l => { x.fillText(l, M, y); y += 40; }); }
  // kaki: kutipan Dasa Darma + QR
  const fy = H - M - 150;
  x.fillStyle = '#fe932c'; x.font = `800 22px ${F}`; x.fillText('DASA DARMA KE-1 & KE-2', M, fy + 10);
  x.fillStyle = '#f9efe8'; x.font = `italic 500 28px ${F}`;
  bungkusTeks(x, '"Takwa kepada Tuhan Yang Maha Esa. Cinta alam dan kasih sayang sesama manusia."', W - 2 * M - 210).forEach((l, i) => x.fillText(l, M, fy + 54 + i * 38));

  }
}

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Buletin-Ambalan.png'; a.click();
  try { await navigator.clipboard.writeText(cap); } catch (_) { }
  if (k === 'wa') { window.open('https://wa.me/?text=' + encodeURIComponent(cap), '_blank'); toastSukses({ judul: 'Siap dibagikan ke WhatsApp', isi: 'Poster sudah diunduh & caption disalin. Lampirkan poster di WhatsApp yang terbuka (grup Gudep / status).', durasi: 8000 }); }
  else toastSukses({ judul: 'Siap diunggah ke Instagram', isi: 'Poster sudah diunduh & caption disalin. Buka Instagram → Posting/Story → pilih poster → tempel caption.', durasi: 8000 });
};

async function bacaDataTabel(file) {

    let j;
    try { j = JSON.parse((await file.text()).replace(/^﻿/, '')); } catch (err) { throw new Error('Isi JSON tidak valid: ' + err.message); }
    if (j && !Array.isArray(j) && typeof j === 'object') { const arr = Object.values(j).find(Array.isArray); j = arr || [j]; }
    if (!Array.isArray(j)) throw new Error('JSON harus berisi daftar (array) data.');
    return j;
  }
  if (!/\.(xlsx|xls|csv)$/i.test(file.name)) throw new Error('Gunakan file .json, .xlsx, .xls, atau .csv');
  const X = await muatXlsx();
  const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = X.utils.sheet_to_json(ws, { defval: '', raw: false, dateNF: 'yyyy-mm-dd' });
  return rows.map(r => { const o = {}; Object.keys(r).forEach(k => { const kk = String(k).trim().toLowerCase().replace(/[\s.]+/g, '_'); if (kk && !/^__empty/.test(kk)) o[kk] = typeof r[k] === 'string' ? r[k].trim() : r[k]; }); return o; })

}

ACT.resetCache = async (el) => { const r = await aksi(el, () => call('admin.cache')); toast(`Cache disegarkan (${r.tabel} tabel, ${r.ms} ms)`, 'ok'); };
ACT.ujiKecepatan = async (el) => {
  const box = document.getElementById('hasilUji');
  box.innerHTML = `<div class="card p-4 mb-4 text-sm"><span class="spinner"></span> Menguji koneksi ke server…</div>`;
  await aksi(el, async () => {
    const hasil = [];
    for (let i = 0; i < 5; i++) { const t = performance.now(); await call('sistem.ping'); hasil.push(Math.round(performance.now() - t)); }
    const t2 = performance.now(); CACHE_BACA.clear(); await call('dashboard'); const dash = Math.round(performance.now() - t2);
    const rata = Math.round(hasil.reduce((a, b) => a + b, 0) / hasil.length), min = Math.min(...hasil);
    const nilai = (ms, a, b) => ms < a ? ['Cepat', 'chip-hijau'] : ms < b ? ['Normal', 'chip-amber'] : ['Lambat', 'chip-merah'];
    const n1 = nilai(rata, 900, 2000), n2 = nilai(dash, 1800, 4000);
    box.innerHTML = `<div class="card p-4 mb-4 grid sm:grid-cols-3 gap-3 text-sm">
      <div><div class="kpi-label">Waktu tempuh server (ping ×5)</div><div class="text-2xl font-extrabold">${rata} ms</div><div class="text-xs text-coklat-500">tercepat ${min} ms · <span class="chip ${n1[1]}">${n1[0]}</span></div></div>
      <div><div class="kpi-label">Muat dashboard penuh</div><div class="text-2xl font-extrabold">${dash} ms</div><div class="text-xs text-coklat-500"><span class="chip ${n2[1]}">${n2[0]}</span></div></div>
      <div class="text-xs text-coklat-600">Waktu tempuh dipengaruhi jaringan perangkat Anda & server Google. Bila lambat terus: tekan <b>Segarkan cache</b>, arsipkan data lama (otomatis tiap malam), dan pastikan foto dikompres.</div></div>`;
  });
};

  C.tema = JSON.parse(JSON.stringify(t));
  return judulHalaman('Tampilan Depan', 'Atur tema halaman login: pilih warna, unggah foto kegiatan yang tampil bergantian, dan ubah teks sambutan.',
    `<button class="btn btn-ghost" data-act="lihatLogin">Lihat halaman login</button><button class="btn btn-primary" data-act="temaSimpan">Simpan & terapkan</button>`, 'ADMINISTRATOR') + `
  <div class="grid xl:grid-cols-[1fr_1.15fr] gap-5">
    <div class="space-y-4">
      <div class="card p-5"><h3 class="font-bold mb-3">1. Tema warna</h3><div class="grid grid-cols-3 gap-3" id="pilihPreset">
        ${Object.keys(TEMA_WARNA).map(k => { const w = TEMA_WARNA[k]; return `<button type="button" data-act="temaPreset" data-id="${k}" class="text-left"><div class="tema-swatch ${t.preset === k ? 'aktif' : ''}" style="--g1:${w[0]};--g2:${w[1]};--aksen:${w[2]}"><span class="absolute left-2 bottom-2 w-6 h-1.5 rounded-full" style="background:${w[2]}"></span></div><div class="text-xs font-semibold mt-1">${TEMA_NAMA[k]}</div></button>`; }).join('')}
      </div></div>
      <div class="card p-5"><div class="flex items-center justify-between mb-3"><h3 class="font-bold">2. Foto / gambar bergantian <span class="text-xs font-normal text-coklat-500">(maks. 12)</span></h3></div>
        <div id="daftarSlide" class="space-y-2 mb-3"></div>
        <div class="grid sm:grid-cols-2 gap-2">
          <label class="btn btn-ghost justify-center cursor-pointer">＋ Unggah foto<input type="file" id="inTema" accept="image/*" multiple class="hidden"></label>
          <button type="button" class="btn btn-ghost" data-act="temaUrl">＋ Dari tautan (URL / Google Drive)</button>
        </div>
        <p class="text-[11px] text-coklat-500 mt-2">Foto dikompres otomatis (lebar 1920 px) dan disimpan di Drive folder <b>02_Aset/Tema_Halaman_Depan</b>. Gunakan foto kegiatan beresolusi baik, orientasi mendatar. Tanpa foto, tampil pola tema warna.</p>
        <div id="progTema" class="text-xs text-coklat-500 mt-2"></div></div>
      <div class="card p-5"><h3 class="font-bold mb-3">3. Gerak & kegelapan</h3>
        <div class="grid sm:grid-cols-3 gap-3">
          ${fld('Efek pergantian', `<select class="inp" id="tEfek">${opsi([['zoom', 'Pudar + zoom perlahan'], ['pudar', 'Pudar'], ['geser', 'Geser halus']], t.efek)}</select>`)}
          ${fld('Ganti tiap <b id="lblInterval">' + t.interval + '</b> detik', `<input type="range" min="3" max="30" value="${t.interval}" id="tInterval" class="w-full accent-coklat-700">`)}
          ${fld('Kegelapan lapisan <b id="lblGelap">' + t.gelap + '%</b>', `<input type="range" min="10" max="90" value="${t.gelap}" id="tGelap" class="w-full accent-coklat-700">`, 'Lebih gelap = teks lebih mudah dibaca.')}
        </div></div>
      <div class="card p-5"><h3 class="font-bold mb-3">4. Teks sambutan</h3>
        ${fld('Label atas', `<input class="inp" id="tLabel" maxlength="120" value="${e(t.label)}">`)}
        ${fld('Judul (Enter = baris baru)', `<textarea class="inp" id="tJudul" rows="2" maxlength="120">${e(t.judul)}</textarea>`)}
        ${fld('Deskripsi', `<textarea class="inp" id="tSub" rows="2" maxlength="300">${e(t.subjudul)}</textarea>`)}
        ${fld('Teks kaki', `<input class="inp" id="tKaki" maxlength="120" value="${e(t.kaki)}">`)}
      </div>
    </div>
    <div class="xl:sticky xl:top-20 self-start space-y-3">
      <div class="flex items-center justify-between"><h3 class="font-bold">Pratinjau langsung</h3><span class="text-xs text-coklat-500">Desktop & ponsel</span></div>
      <div id="pratinjauTema" class="rounded-2xl overflow-hidden shadow-ambient"></div>
      <div class="mx-auto w-[260px] rounded-[28px] border-[6px] border-coklat-800 overflow-hidden bg-white shadow-ambient"><div id="pratinjauPita"></div>
        <div class="p-4 space-y-2"><div class="h-3 w-20 bg-coklat-200 rounded"></div><div class="h-8 bg-coklat-100 rounded"></div><div class="h-8 bg-coklat-100 rounded"></div><div class="h-8 bg-coklat-700 rounded"></div></div></div>
    </div>
  </div>`;
};
function temaDariForm() {
  const t = C.tema;
  t.efek = document.getElementById('tEfek').value; t.interval = Number(document.getElementById('tInterval').value); t.gelap = Number(document.getElementById('tGelap').value);
  t.label = document.getElementById('tLabel').value; t.judul = document.getElementById('tJudul').value; t.subjudul = document.getElementById('tSub').value; t.kaki = document.getElementById('tKaki').value;
  document.querySelectorAll('[data-ketslide]').forEach(i => { const s = t.slides[Number(i.dataset.ketslide)]; if (s) s.keterangan = i.value; });
  return t;
}
function gambarTema() {
  const t = temaDariForm();
  document.getElementById('lblInterval').textContent = t.interval; document.getElementById('lblGelap').textContent = t.gelap + '%';
  document.getElementById('pratinjauTema').innerHTML = htmlHero(t, 'pratinjau');
  document.getElementById('pratinjauPita').innerHTML = htmlHero(t, 'pita');
  pasangHero(document.getElementById('page'));
}
function gambarSlide() {
  const t = C.tema;
  document.getElementById('daftarSlide').innerHTML = t.slides.length ? t.slides.map((s, i) => `<div class="flex items-center gap-2 p-2 rounded-xl border border-coklat-200 bg-white">
    <img src="${e(s.url)}" data-cad="${e(s.cadangan || '')}" class="w-20 h-12 object-cover rounded-lg bg-coklat-100 flex-none" alt="" referrerpolicy="no-referrer" onerror="if(this.dataset.cad&&this.src!==this.dataset.cad)this.src=this.dataset.cad">
    <input class="inp !py-1.5 text-sm" data-ketslide="${i}" placeholder="Keterangan (mis. Perkemahan Tamu Ambalan 2026)" value="${e(s.keterangan || '')}" maxlength="120">
    <div class="flex flex-none"><button type="button" class="btn btn-ghost btn-sm !px-2" data-act="temaGeser" data-id="${i}" data-arah="-1" ${i === 0 ? 'disabled' : ''} title="Naik">↑</button>
    <button type="button" class="btn btn-ghost btn-sm !px-2" data-act="temaGeser" data-id="${i}" data-arah="1" ${i === t.slides.length - 1 ? 'disabled' : ''} title="Turun">↓</button>
    <button type="button" class="btn btn-ghost btn-sm !px-2 text-red-700" data-act="temaHapusSlide" data-id="${i}" title="Hapus">✕</button></div></div>`).join('')
    : '<div class="p-4 rounded-xl border border-dashed border-coklat-300 text-sm text-coklat-500 text-center">Belum ada foto — halaman depan memakai pola warna tema.</div>';
  document.querySelectorAll('[data-ketslide]').forEach(i => i.oninput = () => { clearTimeout(gambarSlide._t); gambarSlide._t = setTimeout(gambarTema, 250); });
}
VIEWS.tema.after = () => {
  if (!C.tema) return;
  ['tEfek', 'tInterval', 'tGelap', 'tLabel', 'tJudul', 'tSub', 'tKaki'].forEach(id => { const el = document.getElementById(id); el.oninput = el.onchange = () => { clearTimeout(VIEWS.tema._t); VIEWS.tema._t = setTimeout(gambarTema, 150); }; });
  document.getElementById('inTema').onchange = async (ev) => {
    const fs = [...ev.target.files], pg = document.getElementById('progTema');
    for (let i = 0; i < fs.length; i++) {
      if (C.tema.slides.length >= 12) { toast('Maksimal 12 gambar', 'err'); break; }
      pg.innerHTML = `<span class="spinner"></span> Mengunggah ${i + 1}/${fs.length}: ${e(fs[i].name)}`;
      try {
        temaDariForm();
        const r = await call('tema.tambah', { file_base64: await kompresFoto(fs[i], 1920, 0.82), file_name: fs[i].name, keterangan: judulDariFile(fs[i].name) });
        C.tema.slides = r.slides; C.tema.versi = r.versi;
      } catch (err) { toast(fs[i].name + ': ' + err.message, 'err'); }
    }
    pg.textContent = ''; ev.target.value = '';
    gambarSlide(); gambarTema(); toast('Foto ditambahkan. Klik "Simpan & terapkan" untuk menyimpan teks & urutan.', 'ok');
  };
  gambarSlide(); gambarTema();
};
ACT.temaPreset = (el) => {
  C.tema.preset = el.dataset.id;
  document.querySelectorAll('#pilihPreset .tema-swatch').forEach(s => s.classList.remove('aktif'));
  el.querySelector('.tema-swatch').classList.add('aktif');
  gambarTema();
};
ACT.temaGeser = (el) => {
  temaDariForm();
  const i = Number(el.dataset.id), j = i + Number(el.dataset.arah), s = C.tema.slides;
  if (j < 0 || j >= s.length) return;
  [s[i], s[j]] = [s[j], s[i]]; gambarSlide(); gambarTema();
};
ACT.temaHapusSlide = async (el) => {
  temaDariForm();
  const s = C.tema.slides[Number(el.dataset.id)];
  if (!s || !(await konfirmasi('Hapus gambar ini dari halaman depan?', 'Hapus'))) return;
  const r = await aksi(null, () => call('tema.hapus', { kunci: s.id || s.url }));
  C.tema.slides = r.slides; gambarSlide(); gambarTema(); toast('Gambar dihapus', 'ok');
};
ACT.temaUrl = () => modal('Tambah gambar dari tautan', `${fld('Tautan gambar', inp('url', '', 'placeholder="https://… (gambar .jpg/.png, atau tautan berbagi Google Drive)" required'), 'File Google Drive harus dibagikan "Siapa saja yang memiliki link".')}
  ${fld('Keterangan', inp('keterangan', '', 'maxlength="120"'))}`, { submit: 'Tambah', onSubmit: async (d) => {
    temaDariForm();
    const r = await call('tema.tambah', d); C.tema.slides = r.slides; gambarSlide(); gambarTema(); toast('Gambar ditambahkan', 'ok');
  } });
ACT.temaSimpan = async (el) => {
  const t = temaDariForm();
  const r = await aksi(el, () => call('tema.simpan', { preset: t.preset, efek: t.efek, interval: t.interval, gelap: t.gelap, label: t.label, judul: t.judul, subjudul: t.subjudul, kaki: t.kaki,
    slides: t.slides.map(s => ({ id: s.id, url: s.id ? '' : s.url, keterangan: s.keterangan })) }), 'Tema halaman depan disimpan & diterapkan');
  try { localStorage.setItem('simpramuka.tema', JSON.stringify(r)); } catch (_) { }
  C.tema = JSON.parse(JSON.stringify(r));
};
ACT.lihatLogin = () => {
  const t = temaDariForm();
  modal('Pratinjau halaman login', `<div class="rounded-xl overflow-hidden grid lg:grid-cols-2 border border-coklat-200"><div>${htmlHero(t, 'pratinjau')}</div><div class="p-6 bg-white"><div class="h-10 bg-coklat-100 rounded-xl mb-4"></div><div class="h-6 w-24 bg-coklat-200 rounded mb-3"></div><div class="h-10 bg-coklat-50 border rounded mb-2"></div><div class="h-10 bg-coklat-50 border rounded mb-3"></div><div class="h-10 bg-coklat-700 rounded"></div></div></div>`,
    { lebar: true, submit: 'Tutup', onSubmit: () => { }, onOpen: (f) => pasangHero(f) });
};

/* ---------- Peringatan untuk Admin di Dashboard ---------- */
async function peringatanAdmin() {
  if (!isAdmin()) return;
  const w = await call('admin.peringatan').catch(() => []);
  const el = document.getElementById('peringatanAdmin');
  if (el && w.length) el.innerHTML = `<div class="card p-4 mb-4 border-amber-300 bg-amber-50"><div class="font-semibold text-amber-900 mb-1">Perlu perhatian Admin</div>
    <ul class="text-sm text-amber-900 space-y-1">${w.map(x => `<li>• ${e(x.teks)} <a class="underline font-semibold" href="#/${x.ke}">Buka</a></li>`).join('')}</ul></div>`;
}
</script>
  <script>boot();</script>
</body>
